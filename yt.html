<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DEWB video player</title>
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden}#p{position:absolute;inset:0;width:100%;height:100%}</style></head>
<body><div id="p"></div>
<script>
/* DEWB 공용 영상 재생기 (2026-11-27)
   컴퓨터에 저장된 수업 파일(file://)에서는 YouTube가 바로 재생되지 않아서, 수업 파일이 이 페이지를 iframe으로 불러 재생한다.
   주소: yt.html?v=<영상ID>
   받는 명령(postMessage): {cmd:"play"|"pause"} {cmd:"seek",t:초,play:true} {cmd:"rate",r:1.25} {cmd:"cc",on:true}
   보내는 신호: {src:"dewb-yt",type:"ready"} {src:"dewb-yt",type:"time",t,dur,state} */
const q=new URLSearchParams(location.search);const vid=(q.get("v")||"").replace(/[^A-Za-z0-9_-]/g,"").slice(0,20);
let P=null;const up=m=>{try{parent.postMessage(Object.assign({src:"dewb-yt",v:vid},m),"*");}catch(e){}};
window.onYouTubeIframeAPIReady=()=>{P=new YT.Player("p",{videoId:vid,playerVars:{rel:0,playsinline:1,cc_load_policy:0,modestbranding:1},
 events:{onReady:()=>up({type:"ready"}),onError:e=>up({type:"error",code:e.data})}});
 setInterval(()=>{if(P&&P.getCurrentTime)up({type:"time",t:P.getCurrentTime()||0,dur:P.getDuration?P.getDuration()||0:0,state:P.getPlayerState?P.getPlayerState():-1});},250);};
window.addEventListener("message",e=>{const m=e.data;if(!m||!P||typeof m.cmd!=="string")return;try{
 if(m.cmd==="play")P.playVideo();else if(m.cmd==="pause")P.pauseVideo();
 else if(m.cmd==="seek"){P.seekTo(Math.max(0,Number(m.t)||0),true);if(m.play)P.playVideo();}
 else if(m.cmd==="rate")P.setPlaybackRate(Number(m.r)||1);
 else if(m.cmd==="cc"){if(m.on){P.loadModule("captions");P.setOption("captions","track",{languageCode:"en"});}else P.unloadModule("captions");}
}catch(err){}});
if(vid){const s=document.createElement("script");s.src="https://www.youtube.com/iframe_api";document.head.appendChild(s);}
</script></body></html>
