<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Phrases</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
:root{--page:#E6F4F1;--card:#FFFFFF;--ink:#1B1B1B;--sub:#56656B;--coral:#F2624B;--yellow:#F7C948;--line:#1B1B1B;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--page:#14201F;--card:#1F2B2B;--ink:#F2F5F4;--sub:#A9B8B6;--line:#0A0F0F}}
*{box-sizing:border-box}body{margin:0;background:var(--page);color:var(--ink);font-family:"Nunito","Jua",system-ui,sans-serif}
.ko{font-family:"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif}
main{max-width:460px;margin:0 auto;padding:16px 16px 40px}
.back{color:var(--sub);text-decoration:none;font-size:15px}
.hero{margin:10px 0 18px;background:#8FD0E8;color:#1B1B1B;border:3px solid var(--line);border-radius:24px;box-shadow:0 6px 0 var(--line);padding:18px 20px}
.hero h1{font-family:"Jua";font-weight:400;font-size:30px;margin:0 0 2px}.hero p{margin:0;font-size:15px}
.card{background:var(--card);border:3px solid var(--line);border-radius:18px;box-shadow:0 5px 0 var(--line);padding:14px 16px;margin-bottom:14px}
.en{font-size:19px;font-weight:900;margin:0 0 6px}.why{font-size:15px;margin:0 0 6px}.meta{font-size:13px;color:var(--sub);margin:0 0 10px}
.row{display:flex;gap:10px}.b{font:inherit;font-size:15px;border:2.5px solid var(--line);border-radius:12px;padding:6px 12px;background:var(--yellow);color:#1B1B1B;cursor:pointer;box-shadow:0 3px 0 var(--line)}
.b.del{background:var(--card);color:var(--ink)}.empty{text-align:center;color:var(--sub);margin-top:40px}
</style></head><body><main>
<a class="back ko" id="back" href="index.html">‹ 상황 연습으로</a>
<div class="hero"><h1>My Phrases</h1><p class="ko">실전 대화에서 저장한 표현을 모아 봤어요.</p></div>
<div id="list"></div>
</main>
<script>
(function(){const SID=(new URLSearchParams(location.search).get('s')||'guest').replace(/[^a-z0-9-]/gi,'');document.getElementById('back').href='index.html?s='+SID;
const K='dewb:phrases:'+SID;let arr=[];try{arr=JSON.parse(localStorage.getItem(K)||'[]')}catch(e){}
function speak(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.95;speechSynthesis.speak(u)}catch(e){}}
function draw(){const L=document.getElementById('list');L.innerHTML='';if(!arr.length){L.innerHTML='<p class="empty ko">아직 저장한 표현이 없어요.<br>실전 대화를 마치고 마음에 드는 표현을 저장해 보세요.</p>';return}
arr.forEach((p,i)=>{const c=document.createElement('div');c.className='card';c.innerHTML='<p class="en"></p><p class="why ko"></p><p class="meta ko"></p><div class="row"><button class="b ko" type="button">듣기</button><button class="b del ko" type="button">지우기</button></div>';
c.querySelector('.en').textContent=p.en;c.querySelector('.why').textContent=p.why||'';c.querySelector('.meta').textContent=(p.who?p.who+' · ':'')+(p.title||'');
const [pl,dl]=c.querySelectorAll('button');pl.onclick=()=>speak(p.en);dl.onclick=()=>{arr.splice(i,1);try{localStorage.setItem(K,JSON.stringify(arr))}catch(e){}draw()};L.appendChild(c)})}
draw()})();
</script></body></html>
