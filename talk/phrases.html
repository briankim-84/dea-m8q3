<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Phrases</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;600;700&family=Nanum+Pen+Script&display=swap" rel="stylesheet">
<style>
:root{--paper:#FBF7EE;--ink:#1F2A44;--hl:#FFE36E;--red:#D64541;--rule:#DCE5EF;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif;display:flex;justify-content:center}
main{width:100%;max-width:460px;min-height:100vh;position:relative;padding:14px 16px 40px 54px;background:repeating-linear-gradient(transparent 0 33px,var(--rule) 33px 34px)}
main:before{content:"";position:absolute;top:0;bottom:0;left:38px;width:2px;background:#EBAAA4}
.ko{font-family:inherit}
.back{font-family:"Nanum Pen Script";font-size:24px;color:var(--ink);text-decoration:none}
.hero{margin:10px 0 16px}.hero h1{font-family:"Nanum Pen Script";font-weight:400;font-size:48px;line-height:1.05}
.hero h1{background:linear-gradient(transparent 58%,var(--hl) 58%,var(--hl) 92%,transparent 92%);display:inline}
.hero p{font-size:14px;color:#5B6478;margin-top:8px}
.card{padding:12px 0 14px;border-bottom:1px dashed #D5CDB8}
.en{font-size:19px;font-weight:700;margin:0 0 4px}.why{font-size:14.5px;color:#4B5563;margin:0 0 4px;line-height:1.55}.meta{font-family:"Nanum Pen Script";font-size:20px;color:var(--red);margin:0 0 8px}
.row{display:flex;gap:8px}.b{font:inherit;font-size:13.5px;font-weight:600;border:1.8px solid var(--ink);border-radius:999px;padding:4px 12px;background:transparent;color:var(--ink);cursor:pointer}
.b.del{border-color:#B8B2A2;color:#8A8F98}.empty{color:#5B6478;margin-top:30px;line-height:1.7}
</style></head><body><main>
<a class="back" id="back" href="index.html">‹ 상황 연습 노트</a>
<div class="hero"><h1>My Phrases</h1><p class="ko">실전 대화와 표현 노트에서 옮겨 적은 표현이에요.</p></div>
<div id="list"></div>
</main>
<script>
(function(){const SID=(new URLSearchParams(location.search).get('s')||'guest').replace(/[^a-z0-9-]/gi,'');document.getElementById('back').href='index.html?s='+SID;
const K='dewb:phrases:'+SID;let arr=[];try{arr=JSON.parse(localStorage.getItem(K)||'[]')}catch(e){}
function speak(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.95;speechSynthesis.speak(u)}catch(e){}}
function draw(){const L=document.getElementById('list');L.innerHTML='';if(!arr.length){L.innerHTML='<p class="empty ko">아직 저장한 표현이 없어요.<br>실전 대화를 마치고 마음에 드는 표현을 저장해 보세요.</p>';return}
arr.forEach((p,i)=>{const c=document.createElement('div');c.className='card';c.innerHTML='<p class="en"></p><p class="why ko"></p><p class="meta ko"></p><div class="row"><button class="b ko" type="button">듣기</button><button class="b del ko" type="button">지우기</button></div>';
c.querySelector('.en').textContent=p.en;c.querySelector('.why').textContent=p.why||'';c.querySelector('.meta').textContent=(p.who?p.who+' · ':'')+(p.title||'');
const [pl,dl]=c.querySelectorAll('button');pl.onclick=()=>speak(p.en);dl.onclick=()=>{arr.splice(i,1);try{localStorage.setItem(K,JSON.stringify(arr))}catch(e){}draw()};L.appendChild(c)})}
draw()})();
</script></body></html>
