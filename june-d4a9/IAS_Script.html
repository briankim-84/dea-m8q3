<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>June IAS Script</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
html{color-scheme:light}body{margin:0}[hidden]{display:none!important}
@media (prefers-color-scheme: dark){html{color-scheme:dark}}
/* layout: sticky tool bar on top, one long reading column of slide cards (thumb left, script right) */
:root{
  --bg:#F4F6F9; --card:#FFFFFF; --fg:#14213D; --mute:#5D6B82; --line:#DCE2EA;
  --slash:#0F7C78; --arrow:#B9770E; --stress:#14213D; --chg:#C2410C; --done:#1E7A4C; --soft:#E9EEF5;
  --serif:"Source Serif 4",Georgia,"Times New Roman",serif; --ui:"Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1626; --card:#16213A; --fg:#E7EBF2; --mute:#9AA7BD; --line:#2A3654;
  --slash:#4CC3BA; --arrow:#F0B648; --stress:#FFFFFF; --chg:#FB923C; --done:#4ADE80; --soft:#1D2A47; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1626; --card:#16213A; --fg:#E7EBF2; --mute:#9AA7BD; --line:#2A3654;
  --slash:#4CC3BA; --arrow:#F0B648; --stress:#FFFFFF; --chg:#FB923C; --done:#4ADE80; --soft:#1D2A47; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--ui);font-size:14px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--card)}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{padding-block:20px 8px}
header.top h1{font-family:var(--serif);font-size:26px;margin:0;text-wrap:balance}
header.top p{margin:4px 0 0;color:var(--mute);font-size:13px;max-width:70ch}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding-block:8px}
.tools{display:flex;flex-wrap:wrap;gap:6px}
.tool{font:inherit;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:6px;padding:5px 10px;cursor:pointer;display:flex;gap:6px;align-items:center}
.tool b.sym{font-family:var(--serif);font-size:16px;min-width:1.2em;text-align:center}
.tool[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.tool:focus-visible,.btn:focus-visible,.w:focus-visible,textarea:focus-visible{outline:2px solid var(--slash);outline-offset:2px}
.tool .key{font-size:11px;opacity:.6}
.sp{flex:1}
.views{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:12px;color:var(--mute);width:100%}
.vt{font:inherit;font-size:12px;border:1px solid var(--line);background:var(--card);color:var(--mute);border-radius:999px;padding:2px 10px;cursor:pointer}
.vt[aria-pressed="true"]{background:var(--soft);color:var(--fg);border-color:var(--fg)}
.vt:focus-visible{outline:2px solid var(--slash);outline-offset:2px}
body.hide-b .w.b{font-weight:400}
body.hide-b .script .w.b{color:color-mix(in srgb,var(--fg) 82%,var(--bg))}
body.hide-k .k{display:none}
body.hide-a .ar{display:none}
body.hide-pr .pr{display:none}
body.hide-tip .tip{display:none}
.status{font-size:12px;color:var(--mute)}
.status.err{color:var(--chg)}
.btn{font:inherit;font-size:12.5px;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:6px;padding:4px 10px;cursor:pointer}
.btn.on{background:var(--done);border-color:var(--done);color:#fff}
nav.chips{display:flex;flex-wrap:wrap;gap:4px;padding-block:10px 4px}
nav.chips a{font-size:11.5px;text-decoration:none;color:var(--mute);border:1px solid var(--line);border-radius:4px;padding:1px 6px;font-variant-numeric:tabular-nums;background:var(--card)}
nav.chips a.chg{border-color:var(--chg);color:var(--chg)}
nav.chips a.done{background:var(--done);border-color:var(--done);color:#fff}
nav.chips a.memo::after{content:" •"}
.legend{font-size:12.5px;color:var(--mute);display:flex;flex-wrap:wrap;gap:4px 14px;padding-block:4px 10px}
.legend span b{font-family:var(--serif);color:var(--fg)}
main{display:flex;flex-direction:column;gap:12px;padding-block:6px 60px}
.slide{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px;display:grid;grid-template-columns:200px minmax(0,1fr);gap:14px;scroll-margin-top:70px}
.slide.done{border-color:var(--done)}
.slide.click{grid-template-columns:120px minmax(0,1fr);padding:8px 14px;background:transparent;border-style:dashed}
.slide img{width:100%;border-radius:4px;border:1px solid var(--line);display:block}
.meta{display:flex;flex-direction:column;gap:6px}
.num{font-family:var(--serif);font-weight:700;font-size:15px}
.num small{font-family:var(--ui);font-weight:400;color:var(--mute);font-size:11.5px;margin-left:4px}
.body{min-width:0;display:flex;flex-direction:column;gap:10px}
.script{font-family:var(--serif);font-size:19px;line-height:2;color:var(--fg)}
.script .w:not(.b){color:color-mix(in srgb,var(--fg) 82%,var(--bg))}
.sent{margin:0}
.w{cursor:pointer;border-radius:3px;padding:1px 1px;position:relative}
.w:hover{background:var(--soft)}
.w.b{font-weight:700;color:var(--stress)}
.w.c{box-shadow:inset 0 -1.5px 0 var(--chg)}
.k{color:var(--slash);font-weight:400;margin:0 4px 0 2px;opacity:.85;user-select:none}
.ar{color:var(--arrow);font-family:var(--ui);font-weight:400;font-size:12px;margin-left:1px;vertical-align:4px;opacity:.9;user-select:none}
.pr{font-family:var(--ui);font-size:10px;color:var(--mute);margin-left:2px;vertical-align:6px;line-height:1;opacity:.8}
.paren{color:var(--mute);font-size:15px}
.tip{font-size:12.5px;color:var(--mute);background:var(--soft);border-radius:6px;padding:5px 9px}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
textarea{font:inherit;font-size:13px;width:100%;box-sizing:border-box;border:1px solid var(--line);border-radius:6px;padding:7px 9px;background:var(--bg);color:var(--fg);min-height:38px;resize:vertical}
.clicknote{color:var(--mute);font-size:12.5px;align-self:center}
@media (max-width:640px){.slide{grid-template-columns:1fr}.slide img{max-width:260px}.slide.click{grid-template-columns:90px minmax(0,1fr)}.script{font-size:17px}.tool .key{display:none}}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style></head><body>

<header class="top wrap">
  <h1>IAS 2026 · Presentation Script</h1>
  <p>11/1 노트 원문에 끊어 읽기·강세·억양을 표시했어요. 소리 내서 읽으면서 연습해 보세요. 위 도구를 고르고 단어를 누르면 표시를 직접 바꿀 수 있고, 바꾼 내용은 이 기기에 저장돼요. "보기"에서 필요 없는 표시는 꺼 둘 수 있어요.</p>
</header>

<div class="bar">
  <div class="wrap">
    <div class="tools" role="toolbar" aria-label="표시 도구">
      <button class="tool" id="t-b" data-t="b" aria-pressed="true"><b class="sym">B</b>강세<span class="key">1</span></button>
      <button class="tool" id="t-s" data-t="/" aria-pressed="false"><b class="sym">/</b>끊기<span class="key">2</span></button>
      <button class="tool" id="t-ss" data-t="//" aria-pressed="false"><b class="sym">//</b>쉬기<span class="key">3</span></button>
      <button class="tool" id="t-u" data-t="u" aria-pressed="false"><b class="sym">↗</b>올림<span class="key">4</span></button>
      <button class="tool" id="t-d" data-t="d" aria-pressed="false"><b class="sym">↘</b>내림<span class="key">5</span></button>
      <button class="tool" id="t-x" data-t="x" aria-pressed="false"><b class="sym">⌫</b>지우기<span class="key">6</span></button>
    </div>
    <span class="sp"></span>
    <button class="btn" id="undo" disabled>되돌리기</button>
    <span class="status" id="status" aria-live="polite"></span>
    <div class="views" role="group" aria-label="표시 보기">보기
      <button class="vt" id="v-b" data-v="b" aria-pressed="true">강세</button>
      <button class="vt" id="v-k" data-v="k" aria-pressed="true">끊기 · 쉬기</button>
      <button class="vt" id="v-a" data-v="a" aria-pressed="true">올림 · 내림</button>
      <button class="vt" id="v-pr" data-v="pr" aria-pressed="true">발음</button>
      <button class="vt" id="v-tip" data-v="tip" aria-pressed="true">팁</button>
    </div>
  </div>
</div>

<div class="wrap">
  <nav class="chips" id="chips" aria-label="장 이동"></nav>
  <div class="legend">
    <span><b>굵게</b> 강세</span><span><b style="color:var(--slash)">/</b> 짧게 끊기</span><span><b style="color:var(--slash)">//</b> 길게 쉬기</span>
    <span><b style="color:var(--arrow)">↗</b> 올림</span><span><b style="color:var(--arrow)">↘</b> 내림</span>
    <span>표시는 단어 뒤에 붙어요 · 같은 표시를 다시 누르면 지워져요</span>
    <span style="color:var(--chg)">주황 밑줄 = 내가 바꾼 곳</span>
  </div>
  <main id="main"></main>
</div>

const ORIG = DATA.slides, TIPS = DATA.tips, PRON = DATA.pron;
const TOTAL = 41;
const state = {};           // n -> {tokens, memo, done}
for (const n in ORIG) state[n] = {tokens: JSON.parse(JSON.stringify(ORIG[n])), memo: "", done: false};
let tool = "b", db = null, saveTimers = {}, pending = new Set(), undoStack = [];
const $ = s => document.querySelector(s);

function setStatus(t, err){ const el=$("#status"); el.textContent=t; el.classList.toggle("err",!!err); }
function clean(w){ return w.toLowerCase().replace(/^[("']+|[.,;:)"']+$/g,""); }
function same(a,b){ return a.b===b.b && a.k===b.k && a.a===b.a; }
function isChanged(n){ const s=state[n]; return JSON.stringify(s.tokens)!==JSON.stringify(ORIG[n]); }

function renderSlide(n){
  const el=document.getElementById("s"+n); if(!el) return;
  const s=state[n], body=el.querySelector(".script");
  body.innerHTML="";
  s.tokens.forEach((sent,si)=>{
    const p=document.createElement("p"); p.className="sent";
    const txt=sent.map(t=>t.w).join(" ");
    if(txt.startsWith("(")){ p.innerHTML='<span class="paren"></span>'; p.firstChild.textContent=txt+"  — 괄호 문장(노트 원문)"; body.appendChild(p); return; }
    sent.forEach((t,i)=>{
      const o=ORIG[n][si][i];
      const w=document.createElement("span");
      w.className="w"+(t.b?" b":"")+(same(t,o)?"":" c");
      w.textContent=t.w; w.tabIndex=0; w.dataset.n=n; w.dataset.s=si; w.dataset.i=i;
      w.setAttribute("role","button");
      p.appendChild(w);
      const pr=PRON[clean(t.w)];
      if(pr){ const x=document.createElement("span"); x.className="pr"; x.textContent=pr; p.appendChild(x); }
      if(t.a){ const a=document.createElement("span"); a.className="ar"; a.textContent=t.a==="u"?"↗":"↘"; p.appendChild(a); }
      if(t.k){ const k=document.createElement("span"); k.className="k"; k.textContent=t.k; p.appendChild(k); }
      p.appendChild(document.createTextNode(" "));
    });
    body.appendChild(p);
  });
  renderChip(n);
}
function renderChip(n){
  const a=document.getElementById("c"+n); if(!a) return;
  const s=state[n];
  a.className=isChanged(n)?"chg":"";
}

function build(){
  const main=$("#main"), chips=$("#chips");
  for(let n=1;n<=TOTAL;n++){
    const has=!!ORIG[n];
    const a=document.createElement("a"); a.href="#s"+n; a.textContent=n; a.id="c"+n;
    if(!has) a.style.opacity=".45";
    a.addEventListener("click",e=>{e.preventDefault();document.getElementById("s"+n).scrollIntoView({behavior:"smooth",block:"start"});});
    chips.appendChild(a);
    const sec=document.createElement("section"); sec.id="s"+n; sec.className="slide"+(has?"":" click");
    const img='<img alt="슬라이드 '+n+'" loading="lazy" src="'+(THUMBS[n]||"")+'">';
    if(!has){
      sec.innerHTML='<div class="meta"><div class="num">'+n+'</div>'+img+'</div><div class="clicknote">노트 없음 · 클릭만 하고 넘어가는 장</div>';
      main.appendChild(sec); continue;
    }
    sec.innerHTML='<div class="meta"><div class="num">'+n+'<small></small></div>'+img+'</div>'+
      '<div class="body"><div class="script"></div>'+(TIPS[n]?'<div class="tip"></div>':'')+
      '<div class="row"><button class="btn resetbtn">이 장 원래대로</button></div></div>';
    if(TIPS[n]) sec.querySelector(".tip").textContent=TIPS[n];
    const words=ORIG[n].flat().length; sec.querySelector(".num small").textContent=words+"단어";
    main.appendChild(sec);
    sec.querySelector(".resetbtn").addEventListener("click",()=>{ pushUndo(n); state[n].tokens=JSON.parse(JSON.stringify(ORIG[n])); renderSlide(n); queueSave(n); });
    renderSlide(n);
  }
}

function pushUndo(n){ undoStack.push({n, tokens:JSON.stringify(state[n].tokens)}); if(undoStack.length>200) undoStack.shift(); $("#undo").disabled=false; }
$("#undo").addEventListener("click",()=>{ const u=undoStack.pop(); if(!u) return; state[u.n].tokens=JSON.parse(u.tokens); renderSlide(u.n); queueSave(u.n); $("#undo").disabled=!undoStack.length; });

function applyTool(n,si,i){
  const t=state[n].tokens[si][i]; pushUndo(n);
  if(tool==="b") t.b=t.b?0:1;
  else if(tool==="/"||tool==="//") t.k=(t.k===tool)?"":tool;
  else if(tool==="u"||tool==="d") t.a=(t.a===tool)?"":tool;
  else if(tool==="x"){ t.b=0; t.k=""; t.a=""; }
  renderSlide(n); queueSave(n);
}
document.addEventListener("click",e=>{ const w=e.target.closest(".w"); if(w) applyTool(w.dataset.n,+w.dataset.s,+w.dataset.i); });
document.addEventListener("keydown",e=>{
  if(e.target.tagName==="TEXTAREA") return;
  const w=e.target.closest&&e.target.closest(".w");
  if(w&&(e.key==="Enter"||e.key===" ")){ e.preventDefault(); applyTool(w.dataset.n,+w.dataset.s,+w.dataset.i); return; }
  const map={"1":"b","2":"/","3":"//","4":"u","5":"d","6":"x"};
  if(map[e.key]) setTool(map[e.key]);
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="z"){ e.preventDefault(); $("#undo").click(); }
});
function setTool(t){ tool=t; document.querySelectorAll(".tool").forEach(b=>b.setAttribute("aria-pressed",b.dataset.t===t));
  const layer={b:"b","/":"k","//":"k",u:"a",d:"a"}[t]; if(layer&&hidden.has(layer)) setView(layer,true); }
// ---- view toggles (per viewer, remembered in this browser) ----
let hidden=new Set();
try{ hidden=new Set(JSON.parse(localStorage.getItem("junemark-hide")||"[]")); }catch(e){}
function setView(v,on){ on?hidden.delete(v):hidden.add(v); document.body.classList.toggle("hide-"+v,!on);
  const b=document.getElementById("v-"+v); if(b) b.setAttribute("aria-pressed",on);
  try{ localStorage.setItem("junemark-hide",JSON.stringify([...hidden])); }catch(e){} }
document.querySelectorAll(".vt").forEach(b=>{ b.addEventListener("click",()=>setView(b.dataset.v,hidden.has(b.dataset.v))); });
[...hidden].forEach(v=>setView(v,false));
document.querySelectorAll(".tool").forEach(b=>b.addEventListener("click",()=>setTool(b.dataset.t)));

// ---- persistence (this device only) ----
const KEY="junescript:v1";
function loadLocal(){ try{ const o=JSON.parse(localStorage.getItem(KEY)||"{}");
  for(const n in o){ if(ORIG[n]&&Array.isArray(o[n])&&o[n].length===ORIG[n].length) state[n].tokens=o[n]; } }catch(e){} }
function queueSave(n){ try{ const o=JSON.parse(localStorage.getItem(KEY)||"{}");
  if(isChanged(n)) o[n]=state[n].tokens; else delete o[n];
  localStorage.setItem(KEY,JSON.stringify(o)); setStatus("저장됨 · 이 기기"); }
  catch(e){ setStatus("이 브라우저에서는 저장이 안 돼요",true); } }
loadLocal();
build();
</script>
