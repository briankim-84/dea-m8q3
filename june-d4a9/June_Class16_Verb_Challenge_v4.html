<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>June · Class 16 · Verb Challenge</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;800&family=Inter:wght@400;600;800&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e1b33;--ink:#0a1428;--card:#16284a;--card2:#1c3158;--line:#2a4470;--gold:#e2b84a;--gold2:#f0cc6a;--cream:#f4efe4;--mute:#9fb0c6;--teal:#2ec4b6;--red:#e06a5a;--green:#3fbf7f}
*{box-sizing:border-box}html,body{height:100%}body{margin:0;background:var(--bg);color:var(--cream);font-family:Inter,'Noto Sans KR',sans-serif;overflow:hidden}
#app{height:100%;display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 28px;border-bottom:1px solid var(--line);background:var(--ink)}
.brand{font-size:11px;letter-spacing:3px;color:var(--gold);font-weight:800}h1{font-family:Fraunces,serif;font-size:22px;margin:2px 0 0}
.nav{display:flex;gap:6px}.nav button{background:var(--card);border:1px solid var(--line);color:var(--mute);padding:8px 14px;border-radius:18px;cursor:pointer;font-weight:600;font-family:inherit}
.nav button.on{background:var(--gold);color:var(--ink);border-color:var(--gold)}
.hud{display:flex;gap:22px;text-align:right}.hud b{display:block;font-family:Fraunces,serif;font-size:28px;color:var(--gold2);transition:transform .25s}.hud b.bump{transform:scale(1.35)}.hud span{font-size:10px;letter-spacing:2px;color:var(--mute)}
main{flex:1;position:relative;overflow:hidden}
.screen{position:absolute;inset:0;padding:30px 48px;overflow:auto;opacity:0;transform:translateX(60px);transition:opacity .45s,transform .45s;pointer-events:none}
.screen.on{opacity:1;transform:none;pointer-events:auto}
.kick{font-size:12px;letter-spacing:4px;color:var(--gold);font-weight:800}
h2{font-family:Fraunces,serif;font-size:40px;margin:6px 0 4px}.sub{color:var(--mute);font-size:15px}
.btn{background:var(--card2);border:1px solid var(--line);color:var(--cream);padding:10px 16px;border-radius:10px;cursor:pointer;font-weight:700;font-size:14px;font-family:inherit}
.btn.gold{background:var(--gold);color:var(--ink);border-color:var(--gold)}.btn.red{border-color:var(--red);color:var(--red)}.btn.teal{border-color:var(--teal);color:var(--teal)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
/* part 1 */
.scale{position:relative;margin-top:60px;height:130px}
.scale .bar{position:absolute;left:0;right:0;top:60px;height:6px;border-radius:3px;background:linear-gradient(90deg,#3a4f7a,var(--gold) 55%,var(--red))}
.slot{position:absolute;top:0;width:150px;margin-left:-75px;text-align:center;height:120px}
.slot .ph{font-family:Fraunces,serif;font-size:22px;color:#2a3f66;height:34px}
.slot i{display:block;font-style:normal;font-size:11px;color:var(--mute);margin-top:44px;opacity:0;transition:opacity .4s}
.slot.filled i{opacity:1}.slot.dead .ph{text-decoration:line-through}
.slot .dot{position:absolute;left:50%;top:54px;width:18px;height:18px;margin-left:-9px;border-radius:50%;background:var(--ink);border:2px solid var(--line)}
.chips{display:flex;gap:10px;margin-top:30px;flex-wrap:wrap;min-height:48px}
.chip{background:var(--card2);border:1.5px solid var(--gold);color:var(--gold2);padding:10px 16px;border-radius:20px;font-weight:700;cursor:pointer;font-family:Fraunces,serif;font-size:18px;transition:transform .5s cubic-bezier(.2,.8,.2,1),opacity .3s;position:relative}
.chip.fly{transform:translateY(-140px) scale(.9);opacity:0}
.chip.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.placed{font-family:Fraunces,serif;font-size:22px;color:var(--cream);height:34px;opacity:0;transform:translateY(20px);transition:all .4s}
.slot.filled .placed{opacity:1;transform:none}.slot.filled.dead .placed{color:#5d7393;text-decoration:line-through}
.results{margin-top:26px;display:flex;flex-direction:column;gap:10px}
.res{background:var(--card);border-radius:16px;padding:14px 20px;display:flex;gap:16px;align-items:center;opacity:.35;transition:opacity .4s}
.res.on{opacity:1;outline:2px solid var(--gold)}
.res .n{font-family:Fraunces,serif;font-size:26px;color:var(--gold2);width:34px}
.res .t{font-size:17px;flex:1}.res .t small{display:block;color:var(--mute);font-size:12px;margin-top:3px}
.res .pick{display:flex;gap:6px}.res .pick button{background:transparent;border:1px solid var(--line);color:var(--mute);border-radius:12px;padding:6px 10px;cursor:pointer;font-family:Fraunces,serif;font-size:14px}
.res .pick button.sel{background:var(--gold);color:var(--ink);border-color:var(--gold)}.res .pick button.no{opacity:.3;text-decoration:line-through}
.slot.cur .placed{color:var(--gold2)}.slot.cur .dot{background:var(--gold);border-color:var(--gold);box-shadow:0 0 0 6px rgba(226,184,74,.25)}.slot.dead .placed{color:#5d7393;text-decoration:line-through}.slot.dead.cur .placed{color:var(--red);text-decoration:line-through}
.vpanel{margin-top:16px;background:var(--card);border:2px solid var(--gold);border-radius:22px;padding:22px 30px}.vpanel.dead{border-color:var(--red)}
.vhead{display:flex;align-items:baseline;gap:18px}.vname{font-family:Fraunces,serif;font-size:46px;color:var(--gold2)}.vpanel.dead .vname{color:var(--red)}.vnote{color:var(--mute);font-size:15px}
.vlist{margin:14px 0 0;padding-left:28px}.vlist li{margin:0 0 12px;opacity:0;transform:translateY(10px);animation:up .45s forwards;font-family:Fraunces,serif;font-size:20px;color:var(--cream)}.vlist li::marker{color:var(--gold);font-family:Fraunces,serif}
.vlist .why{font-family:Inter,'Noto Sans KR',sans-serif;font-size:13px;color:var(--mute);margin-top:3px}
/* part 2 */
.grid{display:grid;grid-template-columns:1fr 400px;gap:22px;margin-top:20px}
.big{background:var(--card);border:2px solid var(--gold);border-radius:22px;padding:26px 30px;min-height:430px}
.meaning{font-family:'Noto Sans KR',sans-serif;font-size:32px;font-weight:700;opacity:0;transform:translateY(12px);animation:up .5s forwards}
.meaning small{display:block;font-family:Inter;font-size:13px;color:var(--mute);font-weight:400;margin-top:4px;letter-spacing:2px}
@keyframes up{to{opacity:1;transform:none}}
.src{margin-top:20px;font-size:11px;letter-spacing:3px;color:var(--gold);font-weight:800;opacity:0;animation:up .5s .6s forwards}
.sent{font-family:Fraunces,serif;font-size:25px;line-height:1.4;margin-top:6px;opacity:0;animation:up .5s .8s forwards}
.sent.you{font-size:19px;color:var(--mute)}
.blank{display:inline-block;min-width:150px;border-bottom:3px solid var(--gold);height:26px;vertical-align:-5px;margin:0 6px;position:relative;transition:all .4s}
.blank.filled{border-color:transparent;min-width:0;color:var(--gold2);font-weight:700;height:auto;vertical-align:baseline}
.blank:not(.filled):after{content:"";position:absolute;left:0;right:0;bottom:-3px;height:3px;background:var(--gold2);animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}
.reveal{display:flex;gap:10px;margin-top:22px;perspective:900px}
.vcard{flex:1;position:relative;height:118px;transform-style:preserve-3d;transition:transform .6s;cursor:pointer}
.vcard.flip{transform:rotateY(180deg)}
.vcard .f,.vcard .b{position:absolute;inset:0;border-radius:14px;padding:12px 14px;backface-visibility:hidden}
.vcard .f{background:var(--card2);display:flex;align-items:center;justify-content:center;font-family:Fraunces,serif;font-size:38px;color:var(--gold)}
.vcard .b{background:var(--ink);transform:rotateY(180deg)}
.vcard .b b{font-family:Fraunces,serif;font-size:22px;color:var(--gold2);display:block}.vcard .b span{font-size:12px;color:var(--mute);display:block;margin-top:4px;line-height:1.4}
.vcard.hit .b{outline:2px solid var(--green)}
.three{display:flex;gap:10px;margin-top:14px}
.three div{flex:1;background:var(--card2);border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.45;opacity:0;transform:translateY(10px);transition:all .4s}
.three.on div{opacity:1;transform:none}.three.on div:nth-child(2){transition-delay:.25s}.three.on div:nth-child(3){transition-delay:.5s}
.three b{display:block;font-size:10px;letter-spacing:2px;color:var(--teal);margin-bottom:4px}
.side{display:flex;flex-direction:column;gap:12px}
.timer{background:var(--ink);border-radius:18px;padding:16px;text-align:center}
.ring{width:118px;height:118px;border-radius:50%;margin:0 auto;display:flex;align-items:center;justify-content:center;background:conic-gradient(var(--teal) 0 100%,#223656 100% 100%)}
.ring div{width:94px;height:94px;border-radius:50%;background:var(--ink);display:flex;align-items:center;justify-content:center;font-family:Fraunces,serif;font-size:34px}
.said{background:var(--card2);border-radius:16px;padding:12px 14px;flex:1}
.lab{font-size:11px;letter-spacing:3px;color:var(--gold);font-weight:800;margin-bottom:8px}
.said .v{display:inline-block;background:var(--ink);border:1px solid var(--gold);color:var(--gold2);padding:6px 12px;border-radius:14px;margin:4px 6px 4px 0;font-weight:700;animation:pop .3s}
.said .v.hit{background:var(--gold);color:var(--ink)}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.said input{width:100%;margin-top:8px;background:var(--bg);border:1px solid var(--line);color:var(--cream);border-radius:10px;padding:10px 12px;font-size:16px;font-family:inherit}
.own{background:var(--card2);border-radius:14px;padding:12px 14px}
.own textarea{width:100%;height:64px;background:var(--bg);border:1px solid var(--line);color:var(--cream);border-radius:10px;padding:8px 10px;font-size:14px;font-family:inherit;resize:none}
.cardnav{display:flex;gap:8px;margin-top:14px;align-items:center}
.dots{display:flex;gap:5px;margin-left:auto}.dots i{width:9px;height:9px;border-radius:50%;background:var(--line);display:block}.dots i.on{background:var(--gold)}.dots i.done{background:var(--teal)}
.hintline{display:flex;align-items:center;gap:10px;margin-top:6px;opacity:0;animation:up .5s 1.2s forwards}.hbtn{background:transparent;border:1px solid var(--line);color:var(--gold2);border-radius:12px;padding:3px 10px;font-size:12px;cursor:pointer;font-family:inherit}
.htxt{font-size:14px;color:var(--teal);font-family:Inter,sans-serif}.htxt.pop{animation:pop .3s}.shape{font-family:'Courier New',monospace;letter-spacing:1px;color:var(--gold2)}
.qq{display:block;font-style:normal;color:var(--mute);font-size:11.5px;margin-bottom:3px}
/* part 3 */
.para{background:var(--card);border-radius:18px;padding:24px 28px;font-family:Fraunces,serif;font-size:22px;line-height:1.75;margin-top:20px}
.slotw{background:#2a3a20;border-bottom:3px solid var(--gold);padding:0 4px;cursor:pointer;transition:background .3s}
.slotw.cur{background:var(--gold);color:var(--ink);animation:glow 1s infinite}
.slotw.done{background:transparent;color:var(--gold2);border-color:var(--green)}
@keyframes glow{50%{box-shadow:0 0 0 6px rgba(226,184,74,.25)}}
.fixrow{display:flex;gap:10px;margin-top:16px;align-items:center}
.fixrow input{flex:1;background:var(--bg);border:1px solid var(--line);color:var(--cream);border-radius:10px;padding:12px 14px;font-size:18px;font-family:inherit}
.hintbox{margin-top:10px;font-size:13px;color:var(--mute)}
.ptabs{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}.ptabs button{background:var(--card);border:1px solid var(--line);color:var(--mute);padding:9px 14px;border-radius:14px;cursor:pointer;font-weight:700;font-family:inherit;font-size:14px;display:flex;align-items:center;gap:8px}
.ptabs button b{font-family:Fraunces,serif;color:var(--gold2);font-size:17px}.ptabs button small{font-size:11px;color:var(--mute);font-weight:600}.ptabs button.on{border-color:var(--gold);color:var(--cream);background:var(--card2)}.ptabs button.done small{color:var(--green)}
.psrc{margin-top:16px;font-size:12px;color:var(--mute);letter-spacing:.5px}.psrc+.para{margin-top:8px}
.talk{margin-top:20px;background:var(--card2);border-radius:14px;padding:14px 18px}.talk .lab{font-size:11px;letter-spacing:3px;color:var(--teal);font-weight:800;margin-bottom:8px}
.tq{font-family:Fraunces,serif;font-size:19px;line-height:1.45;margin:4px 0;opacity:0;animation:up .45s forwards}
.rule{margin-top:26px;background:var(--ink);border-left:4px solid var(--gold);padding:16px 20px;font-size:17px;line-height:1.6}

  <div class="said"><div class="lab">JUNE SAID · Brian이 치고 Enter</div><div id="saidbox"></div><input id="saidin" placeholder="동사 입력 → Enter (+1)"></div>
  <div class="own"><div class="lab">JUNE'S OWN · 자기 결과로 하나, 생활로 하나</div><textarea id="own" placeholder="받아 적기">${S2.own[S2.i]||""}</textarea></div>
 </div></div>
 <div class="cardnav"><button class="btn" id="prev">◀</button><button class="btn gold" id="rev">R · 하나 공개</button><button class="btn" id="showthree">세 상황 보기</button><button class="btn gold" id="next">다음 카드 ▶</button><div class="dots">${CARDS.map((_,k)=>`<i class="${k===S2.i?'on':''}"></i>`).join("")}</div></div>`;
 hud();
 const tick=()=>{S2.t--;document.getElementById("tnum").textContent=S2.t;document.getElementById("ring").style.background=`conic-gradient(var(--teal) 0 ${S2.t/30*100}%,#223656 ${S2.t/30*100}% 100%)`;if(S2.t<=0){clearInterval(S2.timer);S2.timer=null;document.getElementById("tnum").textContent="⏱";}};
 document.getElementById("tstart").onclick=()=>{if(S2.timer)return;S2.timer=setInterval(tick,1000);};
 document.getElementById("treset").onclick=()=>{clearInterval(S2.timer);S2.timer=null;S2.t=30;document.getElementById("tnum").textContent=30;document.getElementById("ring").style.background="conic-gradient(var(--teal) 0 100%,#223656 100% 100%)";};
 const inp=document.getElementById("saidin");if(screen===1)inp.focus();
 inp.onkeydown=e=>{if(e.key==="Enter"&&inp.value.trim()){const w=inp.value.trim().toLowerCase();S2.said.push(w);total++;bump("h1");bump("h2");hud();const hit=c.verbs.findIndex(v=>v[0].split(" ")[0]===w.split(" ")[0]);const sp=document.createElement("span");sp.className="v"+(hit>=0?" hit":"");sp.textContent=w;document.getElementById("saidbox").appendChild(sp);if(hit>=0)S2.hits[hit]=1;inp.value="";}};
 const cards=[...s.querySelectorAll(".vcard")];
 const flip=k=>{const el=cards[k];if(!el||el.classList.contains("flip"))return;el.classList.add("flip");if(S2.hits[k])el.classList.add("hit");c.bk.forEach((bk,bi)=>{if(bk!==k)return;const b=document.getElementById(bi===0?"b1":"b2");if(b&&!b.classList.contains("filled")){b.textContent=c.fill[bi];b.classList.add("filled");}});};
 const shape=w=>w.split(" ").map(x=>x[0]+" "+Array(x.length-1).fill("_").join(" ")).join("   ");
 S2.hl=[0,0];s.querySelectorAll(".hbtn").forEach(btn=>btn.onclick=()=>{const bi=+btn.dataset.b;const lv=Math.min(2,++S2.hl[bi]);const h=c.hint[bi];const t=document.getElementById("ht"+bi);
  t.innerHTML=lv===1?h[0]:`${h[0]} &nbsp;·&nbsp; <span class="shape">${shape(c.fill[bi])}</span> (${h[1]})`;t.classList.remove("pop");void t.offsetWidth;t.classList.add("pop");btn.textContent=lv===1?"💡 More":"💡";});
 document.getElementById("rev").onclick=()=>{flip(S2.revealed);S2.revealed++;};
 cards.forEach((el,k)=>el.onclick=()=>flip(k));
 document.getElementById("showthree").onclick=()=>document.getElementById("three").classList.add("on");
 document.getElementById("own").oninput=e=>S2.own[S2.i]=e.target.value;
 document.getElementById("next").onclick=()=>{if(S2.i<CARDS.length-1){S2.i++;renderCard();}};
 document.getElementById("prev").onclick=()=>{if(S2.i>0){S2.i--;renderCard();}};
}
/* ---------- PART 3 ---------- */
function part3(){const s=document.createElement("section");s.className="screen";s.id="p3";document.getElementById("main").appendChild(s);renderPara();}
function renderPara(){const s=document.getElementById("p3");const P=PARAS[S3.p];const F=S3.fix[S3.p];let k=0;
 const html=P.text.map(x=>typeof x==="string"?x:(()=>{const i=k++;const done=F[i];return `<span class="slotw ${i===S3.cur&&!done?'cur':''} ${done?'done':''}" data-i="${i}">${done||x.w}</span>`;})()).join("");
 const slots=P.text.filter(x=>typeof x!=="string");const cur=slots[S3.cur];const allDone=slots.every((_,i)=>F[i]);
 s.innerHTML=`<div class="kick">PART 3 · YOUR OWN WORDS</div><h2>Say It Again, Better</h2>
 <div class="sub">문단 넷. 금색으로 켜진 동사를 오늘 배운 걸로 바꿔 말하면 Brian이 적어요. 다 바꾸면 문단을 한 번에 다시 읽고, 아래 질문으로 짧게 얘기해요.</div>
 <div class="ptabs">${PARAS.map((x,i)=>{const n=x.text.filter(y=>typeof y!=="string").length,d=Object.keys(S3.fix[i]).length;return `<button class="${i===S3.p?'on':''} ${d===n?'done':''}" data-i="${i}"><b>${i+1}</b> ${x.t}<small>${d}/${n}</small></button>`;}).join("")}</div>
 <div class="psrc">${P.src}</div>
 <div class="para">${html}</div>
 ${cur&&!F[S3.cur]?`<div class="fixrow"><span style="font-family:Fraunces,serif;font-size:20px;color:var(--gold2)">${cur.w} →</span><input id="fixin" placeholder="June이 고른 동사"><button class="btn gold" id="fixok">바꾸기</button></div><div class="hintbox">힌트(Brian만): ${cur.hint}</div>`:
 `<div class="row" style="margin-top:16px"><span class="sub">${allDone?'다 바꿨어요. 문단 전체를 June이 다시 읽어요.':''}</span>${S3.p<PARAS.length-1?'<button class="btn gold" id="pnext">다음 문단 ▶</button>':''}<button class="btn" id="dl">받아 적은 것 .txt</button></div>`}
 <div class="talk"><div class="lab">TALK ABOUT IT · 얘기해 보기</div>${P.q.map((q,i)=>`<div class="tq" style="animation-delay:${i*.15}s">${i+1}. ${q}</div>`).join("")}</div>
 <div class="rule"><b>한 줄 규칙</b> — 말로 할 땐 확실한 동사로 바로 가요. 더 센 동사는 글 쓸 때 골라요. 고르느라 멈추는 시간이 발표에선 그대로 손해예요.</div>`;
 s.querySelectorAll(".ptabs button").forEach(b=>b.onclick=()=>{S3.p=+b.dataset.i;const f=S3.fix[S3.p];const n=PARAS[S3.p].text.filter(y=>typeof y!=="string").length;let c=0;while(c<n&&f[c])c++;S3.cur=c;renderPara();});
 s.querySelectorAll(".slotw").forEach(el=>el.onclick=()=>{S3.cur=+el.dataset.i;if(F[S3.cur]){delete F[S3.cur];}renderPara();});
 const fi=document.getElementById("fixin");if(fi){fi.focus();const ok=()=>{if(!fi.value.trim())return;F[S3.cur]=fi.value.trim();total++;bump("h2");hud();const nxt=slots.findIndex((_,i)=>!F[i]);S3.cur=nxt<0?slots.length:nxt;renderPara();};document.getElementById("fixok").onclick=ok;fi.onkeydown=e=>{if(e.key==="Enter")ok();};}
 const pn=document.getElementById("pnext");if(pn)pn.onclick=()=>{S3.p++;S3.cur=0;renderPara();};
 const dl=document.getElementById("dl");if(dl)dl.onclick=()=>{const L=["JUNE · CLASS 16 · VERB CHALLENGE",""];L.push("[PART 2 · June's own sentences]");CARDS.forEach((c,i)=>{if(S2.own[i])L.push(`${i+1}. ${c.ko}: ${S2.own[i]}`);});
  PARAS.forEach((P2,pi)=>{L.push("",`[PART 3 · ${pi+1}. ${P2.t}]`);let j=0;const txt=P2.text.map(x=>typeof x==="string"?x:(S3.fix[pi][j++]||x.w)).join("");L.push(txt);j=0;P2.text.forEach(x=>{if(typeof x!=="string"){L.push(`  ${x.w} → ${S3.fix[pi][j]||"-"}`);j++;}});});
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([L.join("\n")],{type:"text/plain"}));a.download="June_C16_notes.txt";a.click();};
}

part1();part2();part3();nav();go(0);
document.addEventListener("keydown",e=>{if(e.target.tagName==="INPUT"||e.target.tagName==="TEXTAREA")return;if(e.key==="ArrowRight"&&e.shiftKey)go(Math.min(2,screen+1));if(e.key==="ArrowLeft"&&e.shiftKey)go(Math.max(0,screen-1));if(screen===0&&e.key==="ArrowRight"&&!e.shiftKey)document.getElementById("vnext").click();if(screen===0&&e.key==="ArrowLeft"&&!e.shiftKey)document.getElementById("vprev").click();if(screen===1&&(e.key==="r"||e.key==="R"))document.getElementById("rev").click();if(screen===1&&e.key===" "){e.preventDefault();document.getElementById("tstart").click();}});
</script></body></html>
