<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Answer Like an Engineer · Ho-jun — Do English with Brian</title>
<style>
:root{
  --bg:#1A2E4C; --card:#24405F; --edge:#3A5A82; --gold:#C9A432;
  --goldL:#E4C05C; --white:#fff; --muted:#B8C6D8; --dim:#8A97A8;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--bg); color:var(--white); min-height:100vh;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif;
  padding:24px 16px 60px;
}
.wrap{max-width:1000px;margin:0 auto}
header{text-align:center;margin-bottom:26px}
.brand{font-size:11px;font-weight:700;letter-spacing:3px;color:var(--gold);margin-bottom:10px}
h1{font-size:30px;font-weight:800;letter-spacing:-.3px}
.sub{margin-top:8px;font-size:13px;color:var(--muted)}

/* tabs */
.tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;justify-content:center}
.tab{
  flex:1 1 200px;background:var(--card);border:1px solid var(--card);
  border-radius:10px;padding:12px 14px;cursor:pointer;text-align:left;
  transition:.15s;color:var(--white);font-family:inherit;
}
.tab:hover{border-color:var(--edge)}
.tab.on{border-color:var(--gold);background:#2B4A70}
.tab .n{font-size:10px;font-weight:700;letter-spacing:2px;color:var(--gold)}
.tab .t{font-size:14px;font-weight:700;margin-top:4px}
.tab .d{font-size:11px;color:var(--muted);margin-top:3px}

/* context bar */
.ctx{
  background:var(--card);border-radius:10px;padding:14px 18px;margin-bottom:14px;
  border-left:3px solid var(--gold);
}
.ctx .lab{font-size:10px;font-weight:700;letter-spacing:2px;color:var(--gold);margin-bottom:6px}
.ctx .q{font-size:14px;color:var(--white);line-height:1.5}

/* player */
.stage{position:relative;background:#000;border-radius:12px;overflow:hidden;
  border:1px solid var(--edge)}
video{width:100%;display:block;background:#000}
.cap{
  position:absolute;left:0;right:0;bottom:64px;padding:0 6%;
  text-align:center;pointer-events:none;transition:opacity .12s;
}
.cap span{
  display:inline-block;background:rgba(0,0,0,.82);color:#fff;
  padding:9px 16px;border-radius:8px;font-size:19px;line-height:1.45;
  font-weight:500;letter-spacing:.1px;
  text-shadow:0 1px 2px rgba(0,0,0,.9);max-width:100%;
}
.cap.off{opacity:0;visibility:hidden}

/* controls */
.bar{display:flex;gap:10px;align-items:center;margin-top:14px;flex-wrap:wrap}
.btn{
  background:var(--card);border:1px solid var(--edge);color:var(--white);
  border-radius:9px;padding:11px 18px;font-size:14px;font-weight:700;
  cursor:pointer;font-family:inherit;transition:.15s;
}
.btn:hover{border-color:var(--gold)}
.btn.on{background:var(--gold);border-color:var(--gold);color:var(--bg)}
.spacer{flex:1}
.nudge{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--dim)}
.nudge button{
  background:transparent;border:1px solid var(--edge);color:var(--muted);
  width:28px;height:28px;border-radius:6px;cursor:pointer;font-size:13px;
  font-family:inherit;
}
.nudge button:hover{border-color:var(--gold);color:var(--gold)}
#off{min-width:42px;text-align:center;color:var(--muted)}

/* listen-for */
.listen{margin-top:20px;background:var(--card);border-radius:10px;padding:16px 18px}
.listen .lab{font-size:10px;font-weight:700;letter-spacing:2px;color:var(--gold);margin-bottom:10px}
.listen ul{list-style:none;display:flex;flex-wrap:wrap;gap:8px}
.listen li{
  background:#1F3555;border:1px solid var(--edge);border-radius:7px;
  padding:7px 12px;font-size:13px;font-weight:600;
}
.hint{margin-top:12px;font-size:12px;color:var(--muted);line-height:1.6}

footer{text-align:center;margin-top:34px;font-size:11px;color:var(--dim);letter-spacing:1px}
.warn{
  margin-top:16px;background:#3A2B1F;border:1px solid #6B4E2A;border-radius:9px;
  padding:12px 16px;font-size:12px;color:#E8C88A;line-height:1.6;display:none;
}
@media(max-width:640px){
  h1{font-size:22px}
  .cap span{font-size:15px;padding:7px 12px}
  .cap{bottom:52px}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">DO ENGLISH WITH BRIAN</div>
    <h1>Answer Like an Engineer</h1>
    <div class="sub">Ho-jun &nbsp;·&nbsp; Offshore Wind Webinar &nbsp;—&nbsp; Q&amp;A Clips</div>
  </header>

  <div class="tabs" id="tabs"></div>

  <div class="ctx">
    <div class="lab">THE QUESTION</div>
    <div class="q" id="ctxQ"></div>
  </div>

  <div class="stage">
    <video id="vid" controls playsinline preload="metadata"></video>
    <div class="cap off" id="cap"><span id="capT"></span></div>
  </div>

  <div class="bar">
    <button class="btn" id="subBtn">자막 OFF</button>
    <button class="btn" id="replayBtn">처음부터</button>
    <div class="spacer"></div>
    <div class="nudge">
      <span>자막 싱크</span>
      <button id="minus">−</button>
      <span id="off">0.0s</span>
      <button id="plus">+</button>
    </div>
  </div>

  <div class="warn" id="warn">
    ⚠️ 영상을 불러오지 못했어요. 인터넷 연결을 확인하거나, 잠시 후 새로고침 해주세요.
  </div>

  <div class="listen">
    <div class="lab">LISTEN FOR</div>
    <ul id="listenList"></ul>
    <div class="hint" id="listenHint"></div>
  </div>

  <footer>DO ENGLISH WITH BRIAN</footer>
</div>

<script>
const CLIPS = [
  {
    file:"https://briankim-84.github.io/dea-m8q3/hojun-w5t8/clip1.mp4",
    n:"CLIP 1",
    title:"Keeping the pile vertical",
    dur:"1:25",
    q:"\u201CHow are the horizontal and vertical stability adjusted \u2014 especially in a marine environment where you have to deal with swell? Is it all done with computer control systems, or is there a more old-fashioned approach?\u201D",
    listen:["Let's say, take ~","If you imagine ~"],
    hint:"연사가 <b>못을 박는 비유</b>로 파일 그리퍼를 설명해요. 어려운 장비를 일상적인 것에 빗대는 방식에 주목하세요.",
    cues:[
      [0.0,4.9,"...during the presentation, and I think it was asked as well about drilling. But this particular question"],
      [5.5,13.4,"is about the horizontal and vertical stability, and how it's adjusted —"],
      [14.0,17.8,"especially considering the fact that you're in a marine environment, and you have to deal"],
      [17.8,22.0,"with swell and that."],
      [22.0,27.8,"Is this all down to kind of computer control systems,"],
      [28.6,31.2,"or is there a kind of a more old-fashioned approach to it?"],
      [32.7,36.2,"Is that for drilling or driving? Well, let's say, take driving."],
      [39.4,44.5,"Well, the pile itself is usually held in place. So, you know, the reason why we —"],
      [45.0,49.4,"the reason why we put a sledgehammer on top, because the sledgehammer actually resembles the pure"],
      [49.4,53.8,"mechanics behind it. If you imagine you drive a nail into the wood, you have two"],
      [54.3,58.6,"fingers that hold up the nail in your hand, and you drive with the hammer on top. So we provide the hammer,"],
      [58.6,63.3,"and the two fingers are actually pile gripper systems that are mounted to the side of the vessel."],
      [63.3,68.6,"That ensures only the relative position of the pile, and certainly avoids it from tipping over."],
      [71.0,76.6,"Yeah, but it actually avoids as well getting to that place where it becomes more dynamic"],
      [76.6,83.3,"in terms of a tip-over. There are mechanical aids in place that hold the pile in a"],
      [83.3,85.2,"vertical position."]
    ]
  },
  {
    file:"https://briankim-84.github.io/dea-m8q3/hojun-w5t8/clip2.mp4",
    n:"CLIP 2",
    title:"What's the maximum depth?",
    dur:"1:00",
    q:"\u201CWhen it comes to drilling rock with the LDD \u2014 what kind of rock strengths can be drilled through, and what are the maximum depths available?\u201D",
    listen:["That's a challenging question to answer","when it comes to ~","You're talking about ~","It's always project-specific"],
    hint:"1분짜리 답변에 <b>쿠션 → 수치 → 일반화 회피</b>가 다 들어 있어요. 어려운 질문을 어떻게 받아넘기는지 보세요.",
    cues:[
      [0.0,7.4,"...when it comes to what's the maximum depth — that's a challenging question to answer, depending on"],
      [7.4,13.5,"what type of ground you're trying to drill into. So typically, on a monopile project where"],
      [13.5,18.3,"we're looking at drilling it in challenging conditions like hard rock, you're talking about 20 meters."],
      [18.3,25.7,"So you're talking an 8-meter-diameter hole in hard rock, 20 meters deep. So that's what we're"],
      [25.7,30.0,"looking like at the moment, for eight- to nine-meter-diameter piles, right?"],
      [30.0,33.8,"When it comes to — we have drilled"],
      [33.8,39.0,"projects in the past, particularly for jacket pile installation, where we drilled a lot deeper than that,"],
      [39.0,43.5,"but like 40, 50 meters depth, in not as challenging ground,"],
      [43.5,47.3,"not as hard a rock. So with"],
      [47.3,51.7,"anything with drilling, it's always project-specific, because the equipment might be standard,"],
      [51.7,58.5,"but the methodology and the drilling rates is really dependent on any given soil conditions"],
      [58.5,60.2,"within the site."]
    ]
  },
  {
    file:"https://briankim-84.github.io/dea-m8q3/hojun-w5t8/clip3.mp4",
    n:"CLIP 3",
    title:"How long per pile?",
    dur:"2:00",
    q:"\u201CWhat's the typical timeline for installing a monopile \u2014 hammering versus drilling?\u201D",
    listen:["in the range of ~","It's all dependent on ~","switch out ~","You're talking about ~","I would say ~"],
    hint:"숫자가 20번 넘게 나오는데, 하나도 단정적으로 말하지 않아요. 전부 <b>완충 표현으로 감싸서</b> 말합니다.",
    cues:[
      [0.0,7.6,"You're saying between 1.5 to 4 days for a big pile installation. For a big pile, from one"],
      [7.6,13.8,"pile to the next, the physical driving is somewhere in the range of one to two hours maximum."],
      [13.8,21.0,"So when it comes to drilling, then it's all dependent on the soil conditions."],
      [21.0,26.0,"So if it's a drill-drive-drill-drive scenario, and you've driven to penetration, and then you"],
      [26.0,31.0,"are driven to a certain depth, and then you need to switch out to put the drill on top instead of the hammer."],
      [31.0,38.0,"You're talking about potentially 12 hours to get the drill on top: to get the hammer off, get the drill on, and run the drill to depth."],
      [38.0,44.5,"Then you drill out. You're talking, with up to 100 MPa — between 60 and 100 MPa,"],
      [44.5,51.0,"you're talking about 0.3 of a meter per hour of drilling depth, up to 0.3."],
      [52.0,59.0,"Then up to 60 MPa hard rock, you're talking about 0.5 meters per hour in depth that you can drill."],
      [59.0,66.0,"And then in gravelly clay soils or ground conditions,"],
      [66.0,70.0,"you're talking potentially one meter per hour of depth that you can get."],
      [70.0,74.0,"Then when you've drilled that, you take off the drill and put back on the hammer to do the drive-drill-drive."],
      [74.0,78.0,"You're talking another — up to 12 hours, depending."],
      [78.0,81.0,"And then you hammer to depth again."],
      [81.0,87.0,"So I would say, if you're including drive-drill-drive, you have to add a day to a standard installation."],
      [87.0,92.0,"Then we're looking at projects now where they're just starting drilling straight off."],
      [92.0,99.0,"So you're probably talking a day or two that needs to be added to each pile installation. So you're probably talking, having say"],
      [99.0,106.0,"1.5 to 4 days for a big monopile, you're probably talking three to five days for a drill pile installation."],
      [106.0,111.0,"That's including the grouting as well, if you've got a decent-sized grout machine on there"],
      [111.0,115.0,"that's going to do 50 to 200 meters cubed an hour, something like that."],
      [115.0,120.4,"So you're probably talking like five days for a monopile installation."]
    ]
  }
];

const $ = id => document.getElementById(id);
let cur = 0, subsOn = false, offset = 0;

/* ---- build tabs ---- */
CLIPS.forEach((c,i)=>{
  const b=document.createElement('button');
  b.className='tab'+(i===0?' on':'');
  b.innerHTML=`<div class="n">${c.n}</div><div class="t">${c.title}</div><div class="d">${c.dur}</div>`;
  b.onclick=()=>load(i);
  $('tabs').appendChild(b);
});

function load(i){
  cur=i;
  const c=CLIPS[i];
  document.querySelectorAll('.tab').forEach((t,j)=>t.classList.toggle('on',j===i));
  $('vid').src=c.file;
  $('ctxQ').textContent=c.q;
  $('listenList').innerHTML=c.listen.map(x=>`<li>${x}</li>`).join('');
  $('listenHint').innerHTML=c.hint;
  $('capT').textContent='';
  $('warn').style.display='none';
}

/* ---- subtitle sync ---- */
$('vid').addEventListener('timeupdate',()=>{
  if(!subsOn) return;
  const t=$('vid').currentTime - offset;
  const cue=CLIPS[cur].cues.find(c=>t>=c[0]&&t<c[1]);
  $('capT').textContent = cue ? cue[2] : '';
});
$('vid').addEventListener('error',()=>{ $('warn').style.display='block'; });

/* ---- controls ---- */
$('subBtn').onclick=()=>{
  subsOn=!subsOn;
  $('subBtn').textContent = subsOn ? '자막 ON' : '자막 OFF';
  $('subBtn').classList.toggle('on',subsOn);
  $('cap').classList.toggle('off',!subsOn);
  if(!subsOn) $('capT').textContent='';
};
$('replayBtn').onclick=()=>{ $('vid').currentTime=0; $('vid').play(); };
$('minus').onclick=()=>{ offset=Math.round((offset-0.5)*10)/10; $('off').textContent=offset.toFixed(1)+'s'; };
$('plus').onclick =()=>{ offset=Math.round((offset+0.5)*10)/10; $('off').textContent=offset.toFixed(1)+'s'; };

load(0);
</script>
</body>
</html>
