<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Weekly Quiz · Do English with Brian</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#1A2E4C; --navy2:#24406B; --gold:#C9A432; --gold-l:#E3C368;
    --paper:#FFFEF8; --line:#DCE4EE; --margin:#F2B8B8;
    --ok:#2E7D5B; --no:#B4453C; --mute:#9B937E;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{font-family:'Pretendard',sans-serif;background:#CFC9BA;display:flex;justify-content:center;
       min-height:100vh;padding:18px 0 40px;}
  .note{width:100%;max-width:420px;margin:0 12px;background:var(--paper);border-radius:4px;
    box-shadow:0 10px 30px rgba(0,0,0,.2);position:relative;overflow:hidden;min-height:640px;
    background-image:repeating-linear-gradient(transparent,transparent 31px,var(--line) 31px,var(--line) 32px);
    padding:40px 22px 34px 52px;}
  .note::before{content:'';position:absolute;left:38px;top:0;bottom:0;width:1px;background:var(--margin);}
  .holes i{position:absolute;left:11px;width:12px;height:12px;border-radius:50%;
    background:#CFC9BA;box-shadow:inset 0 1px 2px rgba(0,0,0,.3);}
  .tab{position:absolute;top:0;right:20px;background:var(--gold);color:#fff;font-size:10px;
    letter-spacing:2px;font-weight:700;padding:10px 9px 12px;border-radius:0 0 6px 6px;writing-mode:vertical-rl;}
  .soundbtn{position:absolute;top:10px;right:58px;background:none;border:none;font-size:17px;
    cursor:pointer;opacity:.5;padding:4px;}
  .soundbtn.on{opacity:1;}

  .eyebrow{font-family:'Nanum Pen Script';font-size:19px;color:#B0A78E;}
  h1{font-family:'Nanum Pen Script';font-size:36px;color:var(--navy);line-height:1.15;margin-bottom:2px;}
  h1 u{text-decoration-color:var(--gold);text-decoration-thickness:3px;text-underline-offset:5px;}
  .sub{font-size:12px;color:var(--mute);margin-bottom:26px;}
  .back{font-family:'Nanum Pen Script';font-size:18px;color:#B0A78E;background:none;border:none;
    cursor:pointer;display:block;margin-bottom:4px;padding:0;}
  .back:hover{color:var(--gold);}

  /* 레벨 선택 */
  .lv{display:flex;align-items:center;gap:14px;width:100%;background:none;border:none;
      text-align:left;padding:15px 4px;cursor:pointer;font-family:inherit;}
  .lvmark{width:34px;height:34px;flex-shrink:0;border-radius:50%;border:2px solid var(--navy);
      display:flex;align-items:center;justify-content:center;font-family:'Nanum Pen Script';
      font-size:20px;color:var(--navy);background:#fff;}
  .lv.b .lvmark{border-color:var(--gold);color:var(--gold);}
  .lv.c .lvmark{background:var(--navy);color:var(--gold-l);border-color:var(--navy);}
  .lvt{display:block;font-size:17px;font-weight:700;color:var(--navy);}
  .lvd{display:block;font-size:11.5px;color:var(--mute);margin-top:2px;}
  .lvgo{margin-left:auto;font-family:'Nanum Pen Script';font-size:19px;color:var(--gold);}
  .lvdone{margin-left:auto;font-family:'Nanum Pen Script';font-size:17px;color:var(--ok);}

  /* 진행 표시 */
  .steps{display:flex;gap:5px;margin-bottom:18px;}
  .steps i{height:4px;flex:1;background:#E6E1D3;border-radius:2px;}
  .steps i.on{background:var(--gold);}
  .phase{font-size:11px;letter-spacing:2px;color:var(--gold);font-weight:700;margin-bottom:6px;}

  /* 카드 */
  .card{perspective:1000px;height:230px;margin-bottom:16px;cursor:pointer;}
  .cardin{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d;}
  .card.flip .cardin{transform:rotateY(180deg);}
  .face{position:absolute;inset:0;backface-visibility:hidden;border-radius:14px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;padding:22px 18px;text-align:center;}
  .front{background:#fff;border:1.5px solid var(--line);}
  .front .expr{font-size:26px;font-weight:800;color:var(--navy);line-height:1.25;}
  .front .tapme{position:absolute;bottom:16px;font-family:'Nanum Pen Script';font-size:17px;color:#C3BBA6;}
  .back-f{background:var(--navy);transform:rotateY(180deg);}
  .back-f .ko{font-size:19px;font-weight:700;color:var(--gold-l);margin-bottom:14px;line-height:1.4;}
  .back-f .ex{font-size:14px;color:rgba(255,255,255,.82);line-height:1.6;font-style:italic;}
  .navrow{display:flex;align-items:center;gap:10px;}
  .nav{flex:1;padding:12px;border-radius:10px;border:1.5px solid var(--navy);background:#fff;
    color:var(--navy);font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;}
  .nav.pri{background:var(--navy);color:#fff;}
  .nav:disabled{opacity:.3;cursor:default;}
  .count{font-family:'Nanum Pen Script';font-size:19px;color:var(--mute);min-width:44px;text-align:center;}

  /* 퀴즈 */
  .qno{font-family:'Nanum Pen Script';font-size:20px;color:var(--gold);margin-bottom:2px;}
  .qtext{font-size:17.5px;font-weight:700;color:var(--navy);line-height:1.55;margin-bottom:18px;}
  .qtext b{color:var(--gold);}
  .opt{display:block;width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);
    border-radius:10px;padding:14px 15px;margin-bottom:9px;font-family:inherit;font-size:15px;
    color:var(--navy);cursor:pointer;transition:.15s;}
  .opt:hover:not(:disabled){border-color:var(--gold);}
  .opt:disabled{cursor:default;}
  .opt.ok{border-color:var(--ok);background:#EDF6F1;color:var(--ok);font-weight:700;}
  .opt.no{border-color:var(--no);background:#FBEFEE;color:var(--no);}
  .hintline{font-size:12.5px;color:var(--mute);margin-bottom:10px;}
  .hintline span{color:var(--navy);font-weight:600;}
  input.type{width:100%;padding:14px 15px;border:1.5px solid var(--line);border-radius:10px;
    font-family:inherit;font-size:16px;color:var(--navy);background:#fff;}
  input.type:focus{outline:none;border-color:var(--gold);}
  input.type.ok{border-color:var(--ok);background:#EDF6F1;}
  input.type.no{border-color:var(--no);background:#FBEFEE;}
  .fb{margin:12px 0 4px;padding:12px 14px;border-radius:10px;font-size:13.5px;line-height:1.6;}
  .fb.ok{background:#EDF6F1;color:var(--ok);}
  .fb.no{background:#FBEFEE;color:var(--no);}
  .fb .ans{display:block;color:var(--navy);font-weight:700;margin-top:4px;}

  /* 결과 */
  .score{font-family:'Nanum Pen Script';font-size:64px;color:var(--navy);line-height:1;text-align:center;margin:14px 0 2px;}
  .score b{color:var(--gold);}
  .scoresub{text-align:center;font-size:13px;color:var(--mute);margin-bottom:8px;}
  .msg{text-align:center;font-family:'Nanum Pen Script';font-size:23px;color:var(--navy);margin-bottom:22px;}
  .wrongs{border-top:1px solid var(--line);padding-top:14px;margin-bottom:20px;}
  .wrongs h3{font-size:11px;letter-spacing:2px;color:var(--gold);font-weight:700;margin-bottom:10px;}
  .wrongs div{font-size:14px;color:var(--navy);padding:7px 0;border-bottom:1px dashed var(--line);}
  .wrongs div span{color:var(--mute);font-size:12px;margin-left:6px;}

  .foot{margin-top:24px;font-family:'Nanum Pen Script';font-size:19px;color:#B0A78E;}
  .foot b{color:var(--gold);}
  .loading,.empty{font-family:'Nanum Pen Script';font-size:21px;color:#B0A78E;padding:20px 0;}
  @media (prefers-reduced-motion: reduce){ .cardin{transition:none;} }
</style>
</head>
<body>
<div class="note">
  <div class="holes"><i style="top:58px"></i><i style="top:210px"></i><i style="top:362px"></i><i style="top:514px"></i></div>
  <div class="tab">WEEKLY QUIZ</div>
  <button class="soundbtn on" id="sbtn" title="소리 켜기/끄기">🔔</button>
  <div id="app"><div class="loading">이번 주 퀴즈 불러오는 중… ✎</div></div>
  <div class="foot">As always, <b>English with Brian</b> ✍</div>
</div>

<script>
/* ─────────── 소리 (파일 없이 코드로 생성) ─────────── */
let SND=true, AC=null;
function beep(type){
  if(!SND) return;
  try{
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==="suspended") AC.resume();
    const seq = type==="ok" ? [[660,0,.09],[880,.09,.14]]
              : type==="no" ? [[200,0,.16]]
              : [[523,0,.10],[659,.10,.10],[784,.20,.22]];   /* 완료 팡파레 */
    seq.forEach(([f,at,dur])=>{
      const o=AC.createOscillator(), g=AC.createGain();
      o.type = type==="no" ? "sawtooth" : "sine";
      o.frequency.value=f;
      const t=AC.currentTime+at;
      g.gain.setValueAtTime(0.0001,t);
      g.gain.exponentialRampToValueAtTime(type==="no"?0.13:0.18, t+0.015);
      g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
      o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+dur+0.02);
    });
  }catch(e){}
}
document.getElementById("sbtn").addEventListener("click",e=>{
  SND=!SND; e.target.classList.toggle("on",SND); e.target.textContent = SND?"🔔":"🔕";
  if(SND) beep("ok");
});

/* ─────────── 이번 주 데이터 찾기 (ISO 주차 기준, 최대 6주 역추적) ─────────── */
function isoWeek(d){
  const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));
  const day=t.getUTCDay()||7; t.setUTCDate(t.getUTCDate()+4-day);
  const y0=new Date(Date.UTC(t.getUTCFullYear(),0,1));
  return [t.getUTCFullYear(), Math.ceil(((t-y0)/86400000+1)/7)];
}
async function loadWeek(){
  let [y,w]=isoWeek(new Date());
  for(let i=0;i<6;i++){
    const name=`${y}-W${String(w).padStart(2,"0")}.json`;
    try{
      const r=await fetch(name+"?t="+Date.now());
      if(r.ok) return await r.json();
    }catch(e){}
    w--; if(w<1){ y--; w=52; }
  }
  return null;
}

/* ─────────── 화면 ─────────── */
const LV={ warmup:{t:"Warm-up", d:"가볍게 시작하기", m:"A", cls:""},
           intermediate:{t:"Intermediate", d:"한 단계 올려서", m:"B", cls:"b"},
           challenge:{t:"Challenge", d:"직접 써보기", m:"C", cls:"c"} };
let DATA=null, DONE={}, S={};
const DKEY=()=> "dewb:quiz:"+(DATA&&DATA.week?DATA.week:"x");
function loadDone(){ try{ DONE=JSON.parse(localStorage.getItem(DKEY())||"{}")||{}; }catch(e){ DONE={}; } }
function saveDone(){ try{ localStorage.setItem(DKEY(), JSON.stringify(DONE)); }catch(e){}
  try{ const d=new Date(), t=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
    let ds=JSON.parse(localStorage.getItem("dewb:days")||"[]");
    if(!ds.includes(t)){ ds.push(t); if(ds.length>90) ds=ds.slice(-90);
      localStorage.setItem("dewb:days", JSON.stringify(ds)); } }catch(e){} }
const app=()=>document.getElementById("app");
const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));

function homeView(){
  const wk = DATA.label ? `${esc(DATA.label)} 퀴즈` : "이번 주 퀴즈";
  app().innerHTML = `
    <a class="back" id="hubback" style="display:none;text-decoration:none">← 내 노트로</a>
    <div class="eyebrow">Do English with Brian ✎</div>
    <h1><u>Weekly Quiz</u></h1>
    <div class="sub">${wk} · 레벨을 골라 시작하세요</div>
    ${Object.keys(LV).map(k=>{
      const done=DONE[k];
      return `<button class="lv ${LV[k].cls}" data-lv="${k}">
        <span class="lvmark">${LV[k].m}</span>
        <span><span class="lvt">${LV[k].t}</span><span class="lvd">${LV[k].d} · 카드 5 + 문제 5</span></span>
        ${done!=null ? `<span class="lvdone">${done}/5 ✓</span>` : `<span class="lvgo">시작→</span>`}
      </button>`;
    }).join("")}`;
  app().querySelectorAll(".lv").forEach(b=>
    b.addEventListener("click",()=>startLevel(b.dataset.lv)));
  try{
    let hub=sessionStorage.getItem("dewb:hubref");
    if(!hub && document.referrer){
      try{ const u=new URL(document.referrer);
        if(u.origin===location.origin && !u.pathname.includes("/weekly")){
          hub=document.referrer; sessionStorage.setItem("dewb:hubref",hub);
        } }catch(e){}
    }
    if(hub){ const a=document.getElementById("hubback"); a.href=hub; a.style.display="inline-block"; }
  }catch(e){}
}

function startLevel(lv){
  S={lv, i:0, phase:"card", score:0, wrong:[], answered:false};
  cardView();
}

function shell(inner, backTo){
  const total=10, at = S.phase==="card" ? S.i+1 : 5+S.i+1;
  return `
    <button class="back" id="bk">← ${backTo}</button>
    <div class="phase">${LV[S.lv].t.toUpperCase()} · ${S.phase==="card"?"STEP 1 카드로 익히기":"STEP 2 문제 풀기"}</div>
    <div class="steps">${Array.from({length:total},(_,n)=>`<i class="${n<at?"on":""}"></i>`).join("")}</div>
    ${inner}`;
}

function cardView(){
  const c=DATA.levels[S.lv].cards[S.i];
  app().innerHTML = shell(`
    <div class="card" id="cd">
      <div class="cardin">
        <div class="face front"><div class="expr">${esc(c.expr)}</div><div class="tapme">탭해서 뜻 보기 ↻</div></div>
        <div class="face back-f"><div class="ko">${esc(c.ko)}</div><div class="ex">${esc(c.ex)}</div></div>
      </div>
    </div>
    <div class="navrow">
      <button class="nav" id="prev" ${S.i===0?"disabled":""}>이전</button>
      <span class="count">${S.i+1} / 5</span>
      <button class="nav pri" id="next">${S.i===4?"문제 풀기 →":"다음"}</button>
    </div>`, "레벨 선택");
  document.getElementById("cd").addEventListener("click",e=>e.currentTarget.classList.toggle("flip"));
  document.getElementById("bk").addEventListener("click",homeView);
  document.getElementById("prev").addEventListener("click",()=>{ if(S.i>0){S.i--;cardView();} });
  document.getElementById("next").addEventListener("click",()=>{
    if(S.i<4){ S.i++; cardView(); } else { S.phase="quiz"; S.i=0; quizView(); }
  });
}

function quizView(){
  const q=DATA.levels[S.lv].quiz[S.i];
  S.answered=false;
  const order = q.options ? q.options.map((_,n)=>n).sort(()=>Math.random()-.5) : null;
  const body = q.options
    ? order.map(n=>`<button class="opt" data-n="${n}">${esc(q.options[n])}</button>`).join("")
    : `<div class="hintline">힌트 · <span>${esc(q.hint||"")}</span></div>
       <input class="type" id="ti" autocomplete="off" autocapitalize="off" autocorrect="off"
              spellcheck="false" placeholder="빈칸에 들어갈 표현을 써보세요">
       <div class="navrow" style="margin-top:12px"><button class="nav pri" id="chk">확인</button></div>`;
  app().innerHTML = shell(`
    <div class="qno">Q${S.i+1} / 5</div>
    <div class="qtext">${esc(q.q).replace(/___/g,"<b>_____</b>")}</div>
    ${body}
    <div id="fb"></div>`, "레벨 선택");
  document.getElementById("bk").addEventListener("click",homeView);
  if(q.options){
    app().querySelectorAll(".opt").forEach(b=>
      b.addEventListener("click",()=>pick(+b.dataset.n)));
  }else{
    const ti=document.getElementById("ti");
    document.getElementById("chk").addEventListener("click",()=>check(ti.value));
    ti.addEventListener("keydown",e=>{ if(e.key==="Enter") check(ti.value); });
    setTimeout(()=>ti.focus(),120);
  }
}

function norm(s){
  return String(s).toLowerCase().trim()
    .replace(/[.,!?;:'"’]/g,"").replace(/\s+/g," ");
}
function pick(n){
  if(S.answered) return; S.answered=true;
  const q=DATA.levels[S.lv].quiz[S.i], ok=(n===q.answer);
  app().querySelectorAll(".opt").forEach(b=>{
    b.disabled=true;
    const k=+b.dataset.n;
    if(k===q.answer) b.classList.add("ok");
    else if(k===n) b.classList.add("no");
  });
  after(ok, q.options[q.answer], q);
}
function check(val){
  if(S.answered) return;
  if(!norm(val)){ document.getElementById("ti").focus(); return; }
  S.answered=true;
  const q=DATA.levels[S.lv].quiz[S.i];
  const ok=q.accept.some(a=>norm(a)===norm(val));
  const ti=document.getElementById("ti");
  ti.disabled=true; ti.classList.add(ok?"ok":"no");
  document.getElementById("chk").remove();
  after(ok, q.accept[0], q);
}
function after(ok, answer, q){
  beep(ok?"ok":"no");
  if(ok) S.score++; else S.wrong.push({q:q.q, a:answer});
  document.getElementById("fb").innerHTML = `
    <div class="fb ${ok?"ok":"no"}">
      ${ok?"정답이에요!":"아쉬워요."} ${esc(q.note||"")}
      ${ok?"":`<span class="ans">정답: ${esc(answer)}</span>`}
    </div>
    <div class="navrow" style="margin-top:12px">
      <button class="nav pri" id="nx">${S.i===4?"결과 보기 →":"다음 문제"}</button>
    </div>`;
  document.getElementById("nx").addEventListener("click",()=>{
    if(S.i<4){ S.i++; quizView(); } else resultView();
  });
}

function resultView(){
  beep("fin");
  DONE[S.lv]=S.score; saveDone();
  try{ if(DATA && DATA.week) localStorage.setItem("dewb:quizdone", DATA.week); }catch(e){}
  const m = S.score===5 ? "완벽해요! 다음 레벨도 도전해볼까요?"
          : S.score>=4 ? "좋아요! 거의 다 맞혔어요."
          : S.score>=2 ? "잘하고 있어요. 카드 한 번 더 보면 확실해져요."
          : "괜찮아요. 카드부터 다시 보면 금방 익숙해져요.";
  app().innerHTML = `
    <button class="back" id="bk">← 레벨 선택</button>
    <div class="phase">${LV[S.lv].t.toUpperCase()} · 결과</div>
    <div class="score"><b>${S.score}</b> / 5</div>
    <div class="scoresub">${LV[S.lv].t} 완료</div>
    <div class="msg">${m}</div>
    ${S.wrong.length?`<div class="wrongs"><h3>다시 볼 표현</h3>
      ${S.wrong.map(w=>`<div>${esc(w.a)}<span>${esc(w.q)}</span></div>`).join("")}</div>`:""}
    <div class="navrow">
      <button class="nav" id="again">다시 풀기</button>
      <button class="nav pri" id="home">다른 레벨 →</button>
    </div>`;
  document.getElementById("bk").addEventListener("click",homeView);
  document.getElementById("home").addEventListener("click",homeView);
  document.getElementById("again").addEventListener("click",()=>startLevel(S.lv));
}

(async ()=>{
  DATA = await loadWeek();
  if(!DATA){
    app().innerHTML = `<div class="eyebrow">Do English with Brian ✎</div>
      <h1><u>Weekly Quiz</u></h1>
      <div class="empty">이번 주 퀴즈가 아직 준비 중이에요. 월요일에 다시 만나요! ✎</div>`;
    return;
  }
  loadDone();
  homeView();
})();
</script>
</body>
</html>
