<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>My Words · Do English with Brian</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#1A2E4C; --navy2:#24406B; --gold:#C9A432; --gold-l:#E3C368;
    --paper:#FFFEF8; --line:#DCE4EE; --margin:#F2B8B8;
    --ok:#2E7D5B; --no:#B4453C; --mute:#9B937E;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{font-family:'Pretendard',sans-serif;background:#CFC9BA;display:flex;justify-content:center;
       min-height:100vh;padding:18px 0 40px;}
  .note{width:100%;max-width:430px;margin:0 12px;background:var(--paper);border-radius:4px;
    box-shadow:0 10px 30px rgba(0,0,0,.2);position:relative;overflow:hidden;min-height:660px;
    background-image:repeating-linear-gradient(transparent,transparent 31px,var(--line) 31px,var(--line) 32px);
    padding:38px 22px 34px 52px;}
  .note::before{content:'';position:absolute;left:38px;top:0;bottom:0;width:1px;background:var(--margin);}
  .holes i{position:absolute;left:11px;width:12px;height:12px;border-radius:50%;
    background:#CFC9BA;box-shadow:inset 0 1px 2px rgba(0,0,0,.3);}
  .tab{position:absolute;top:0;right:20px;background:var(--gold);color:#fff;font-size:10px;
    letter-spacing:2px;font-weight:700;padding:10px 9px 12px;border-radius:0 0 6px 6px;writing-mode:vertical-rl;}

  .eyebrow{font-family:'Nanum Pen Script';font-size:19px;color:#B0A78E;}
  h1{font-family:'Nanum Pen Script';font-size:34px;color:var(--navy);line-height:1.15;margin-bottom:4px;}
  h1 u{text-decoration-color:var(--gold);text-decoration-thickness:3px;text-underline-offset:5px;}
  .sub{font-size:12px;color:var(--mute);margin-bottom:20px;line-height:1.6;}
  .back{font-family:'Nanum Pen Script';font-size:18px;color:#B0A78E;background:none;border:none;
    cursor:pointer;display:block;margin-bottom:4px;padding:0;text-decoration:none;}

  .btn{display:block;width:100%;padding:15px;border:none;border-radius:12px;cursor:pointer;
    font-family:inherit;font-size:15px;font-weight:700;transition:.12s;}
  .btn:active{transform:scale(.985);}
  .btn.pri{background:var(--navy);color:#fff;}
  .btn.gold{background:var(--gold);color:#14203A;}
  .btn.ghost{background:#fff;border:1.5px solid var(--line);color:var(--navy);}
  .btn:disabled{opacity:.4;cursor:default;}
  .btn+.btn{margin-top:9px;}
  .row2{display:flex;gap:9px;} .row2 .btn{flex:1;margin-top:0;}

  /* 홈 요약 */
  .stat{display:flex;gap:10px;margin:16px 0 20px;}
  .stbox{flex:1;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:13px 8px;text-align:center;}
  .stbox b{display:block;font-family:'Nanum Pen Script';font-size:30px;color:var(--navy);line-height:1;}
  .stbox span{font-size:10.5px;color:var(--mute);}
  .stbox.hot{border-color:var(--gold);} .stbox.hot b{color:var(--gold);}

  /* 단계 표시 */
  .stages{display:flex;gap:5px;margin:4px 0 16px;}
  .stg{flex:1;text-align:center;font-size:10px;color:#C3BBA6;padding:7px 2px;border-radius:8px;
       background:#F2EDE0;font-weight:700;letter-spacing:.4px;border:none;font-family:inherit;cursor:default;}
  .stg.done{cursor:pointer;}
  .stg.done:active{transform:scale(.96);}
  .stg.on{background:var(--gold);color:#fff;}
  .stg.done{background:var(--navy);color:var(--gold-l);}

  .word{font-family:Georgia,serif;font-size:40px;font-weight:700;color:var(--navy);
        text-align:center;line-height:1.15;margin:14px 0 4px;letter-spacing:-.01em;}
  .komean{font-size:17px;font-weight:700;color:var(--gold);text-align:center;margin-bottom:14px;}
  .card{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:18px 16px;margin-bottom:12px;}
  .card .en{font-size:15.5px;color:var(--navy);line-height:1.6;font-weight:600;}
  .card .en b{color:var(--gold);border-bottom:2px solid var(--gold-l);}
  .card .ko{font-size:12.5px;color:var(--mute);margin-top:6px;line-height:1.5;}
  .speak{background:none;border:1.5px solid var(--line);border-radius:10px;padding:8px 13px;
    font-family:inherit;font-size:13px;color:var(--navy);cursor:pointer;display:inline-flex;align-items:center;gap:6px;}
  .center{text-align:center;}

  /* 객관식 */
  .opt{display:block;width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);
    border-radius:12px;padding:14px 15px;margin-bottom:9px;font-family:inherit;font-size:14px;
    line-height:1.55;color:var(--navy);cursor:pointer;transition:.15s;}
  .opt:hover:not(:disabled){border-color:var(--gold);}
  .opt:disabled{cursor:default;}
  .opt.ok{border-color:var(--ok);background:#EDF6F1;font-weight:700;}
  .opt.no{border-color:var(--no);background:#FBEFEE;}
  .fb{margin:10px 0 4px;padding:12px 14px;border-radius:10px;font-size:13px;line-height:1.6;}
  .fb.ok{background:#EDF6F1;color:var(--ok);}
  .fb.no{background:#FBEFEE;color:var(--no);}

  /* 발음 */
  .micwrap{text-align:center;padding:8px 0 4px;}
  .micbtn{width:88px;height:88px;border-radius:50%;border:none;cursor:pointer;font-size:34px;
    background:var(--navy);color:#fff;box-shadow:0 6px 18px rgba(26,46,76,.35);transition:.15s;}
  .micbtn.rec{background:var(--no);animation:pulse 1.1s infinite;}
  @keyframes pulse{0%,100%{transform:scale(1);}50%{transform:scale(1.07);}}
  .micstate{font-size:13px;color:var(--mute);margin-top:12px;min-height:40px;line-height:1.6;}
  .micstate b{color:var(--navy);}
  .heard{display:inline-block;font-family:Georgia,serif;font-size:18px;color:var(--navy);
    background:#fff;border:1.5px dashed var(--gold);border-radius:10px;padding:6px 14px;margin-top:6px;}
  .passmark{font-family:'Nanum Pen Script';font-size:44px;color:var(--ok);}
  .loadbar{height:7px;background:#EBE5D6;border-radius:4px;overflow:hidden;margin-top:10px;}
  .loadbar i{display:block;height:100%;width:0;background:var(--gold);transition:width .3s;}

  /* 복습 */
  .recall{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:26px 18px;
    text-align:center;margin-bottom:14px;min-height:150px;display:flex;flex-direction:column;justify-content:center;}
  .recall .k{font-size:20px;font-weight:800;color:var(--navy);}
  .recall .hint{font-family:'Nanum Pen Script';font-size:17px;color:#C3BBA6;margin-top:10px;}
  .recall .e{font-family:Georgia,serif;font-size:30px;font-weight:700;color:var(--gold);margin-top:8px;}

  .done-badge{font-family:'Nanum Pen Script';font-size:21px;color:var(--ok);text-align:center;margin:8px 0;}
  .foot{margin-top:22px;font-family:'Nanum Pen Script';font-size:18px;color:#B0A78E;}
  .foot b{color:var(--gold);}
  .loading{font-family:'Nanum Pen Script';font-size:21px;color:#B0A78E;padding:20px 0;}
  .small{font-size:11px;color:var(--mute);line-height:1.6;margin-top:10px;}
  .howbtn{display:block;width:100%;margin-top:14px;background:none;border:none;cursor:pointer;
    font-family:'Nanum Pen Script';font-size:19px;color:#B0A78E;text-align:left;padding:4px 0;}
  .how{background:#fff;border:1.5px dashed var(--gold-l);border-radius:12px;padding:14px 15px;margin-top:6px;}
  .how p{font-size:12.5px;color:#4A4536;line-height:1.75;margin:0;}
  .how p+p{margin-top:10px;}
  .how b{color:var(--navy);}
  .how .dim{font-size:11px;color:var(--mute);}
  .dsearch{width:100%;margin:10px 0 6px;padding:11px 13px;border:1.5px solid var(--line);
    border-radius:11px;font-family:inherit;font-size:14px;background:#fff;color:var(--navy);}
  .dsearch:focus{outline:none;border-color:var(--gold);}
  .dgroup{font-family:'Nanum Pen Script';font-size:19px;color:#8A8268;margin:14px 0 6px;}
  .dgroup i{font-style:normal;color:var(--gold);}
  .drow{display:flex;align-items:center;gap:10px;background:#fff;border:1.5px solid var(--line);
    border-radius:11px;padding:10px 12px;margin-bottom:6px;cursor:pointer;}
  .drow.dknown{opacity:.55;}
  .dspk{background:none;border:none;font-size:16px;cursor:pointer;padding:2px;flex:none;}
  .dw{font-family:Georgia,serif;font-weight:700;font-size:16px;color:var(--navy);flex:none;}
  .dpron{font-size:11px;}
  .dko{font-size:12.5px;color:var(--mute);margin-left:auto;text-align:right;}
  .ddet{background:#FBF8EE;border:1.5px dashed var(--gold-l);border-radius:11px;
    padding:11px 13px;margin:-2px 0 8px;}
  .den{font-size:13.5px;color:var(--navy);font-weight:600;line-height:1.55;}
  .dexko{font-size:11.5px;color:var(--mute);margin-top:3px;}
  .dnote{font-size:11.5px;color:#8A6D1F;margin-top:6px;line-height:1.55;}
</style>
</head>
<body>
<div class="note">
  <div class="holes"><i style="top:58px"></i><i style="top:210px"></i><i style="top:362px"></i><i style="top:514px"></i></div>
  <div class="tab">MY WORDS</div>
  <div id="app"><div class="loading">단어장 여는 중… ✎</div></div>
  <div class="foot">As always, <b>English with Brian</b> ✍</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/vosk-browser@0.0.8/dist/vosk.js"></script>
<script>
/* ═══════════ 설정 ═══════════ */
const P=new URLSearchParams(location.search);
const FOLDER=(P.get("s")||"").replace(/[^a-z0-9-]/g,"");
const MODEL_URL=P.get("model")||"https://ccoreilly.github.io/vosk-browser/models/vosk-model-small-en-us-0.15.tar.gz";
const KEY="dewb:words:"+FOLDER;
const BOX_DAYS=[0,3,7,14];            /* box0=학습큐, 이후 복습 간격, box4=졸업 */
const NEW_BATCH=20;                    /* 한 번에 열리는 새 단어 수 */

/* ═══════════ 상태 ═══════════ */
let TRACK=null, ST={}, session=[], cur=null, phase=null, mcqPicked=false;
const $=id=>document.getElementById(id);
const app=()=>$("app");
const now=()=>Date.now();
function isoWeek(d){ d=new Date(d); d.setHours(0,0,0,0);
  d.setDate(d.getDate()+3-((d.getDay()+6)%7));
  const w1=new Date(d.getFullYear(),0,4);
  return d.getFullYear()+"-W"+String(1+Math.round(((d-w1)/86400000-3+((w1.getDay()+6)%7))/7)).padStart(2,"0"); }
const THIS_WEEK=isoWeek(new Date());
const days=n=>n*86400000;
const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));

function load(){ try{ ST=JSON.parse(localStorage.getItem(KEY)||"{}")||{}; }catch(e){ ST={}; } }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(ST)); }catch(e){}
  try{ const d=new Date(), t=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
    let ds=JSON.parse(localStorage.getItem("dewb:days")||"[]");
    if(!ds.includes(t)){ ds.push(t); if(ds.length>90) ds=ds.slice(-90);
      localStorage.setItem("dewb:days", JSON.stringify(ds)); } }catch(e){} }
function S(w){ return ST[w] || (ST[w]={st:0,box:0,due:0,known:false,pron:1}); }

/* ═══════════ 큐 구성 ═══════════ */
function buildQueues(){
  const words=TRACK.words;
  const reviews=[], news=[];
  let locked=0;
  for(const item of words){
    const s=S(item.w);
    if(s.known) continue;
    if(item.wk && item.wk > THIS_WEEK){ locked++; continue; }   /* 아직 안 열린 주차 */
    if(s.st>=4){                                  /* 학습 완료 → 복습 대상 */
      if(s.box<4 && s.due<=now()) reviews.push(item);
    }else{
      if(news.length < NEW_BATCH) news.push(item);
    }
  }
  return {reviews, news, locked};
}

/* ═══════════ 홈 ═══════════ */
function home(){
  const q=buildQueues();
  const total=TRACK.words.length;
  const doneN=TRACK.words.filter(x=>S(x.w).st>=4||S(x.w).known).length;
  const masterN=TRACK.words.filter(x=>S(x.w).box>=4).length;
  app().innerHTML=`
    <a class="back" href="../${FOLDER}/">← 오늘 할 일로</a>
    <div class="eyebrow">Do English with Brian ✎</div>
    <h1><u>My Words</u></h1>
    <div class="sub">${esc(TRACK.student)}님의 단어 트랙 · ${esc(TRACK.band)} 구간<br>
      매주 월요일 새 단어 20개가 열려요</div>
    <div class="stat">
      <div class="stbox ${q.reviews.length?'hot':''}"><b>${q.reviews.length}</b><span>오늘 복습</span></div>
      <div class="stbox"><b>${doneN}</b><span>익힌 단어 / ${total}</span></div>
      <div class="stbox"><b>${masterN}</b><span>완전히 내 것</span></div>
    </div>
    <button class="btn gold" id="go">${q.reviews.length? "복습부터 시작" : "새 단어 배우기"}</button>
    <div class="small">원하는 만큼 이어서 할 수 있어요. 중간에 멈춰도 진행은 저장됩니다.</div>
    <button class="btn ghost" id="dict" style="margin-top:9px">📖 내 단어장</button>
    ${doneN>0?`<button class="btn ghost" id="fp" style="margin-top:9px">🔁 자유 연습 — 익힌 단어 훑어보기</button>`:""}
    <button class="howbtn" id="howT">어떻게 하는 건가요? ▾</button>
    <div class="how" id="how" style="display:none">
      <p><b>새 단어는 4단계</b>로 익혀요.<br>
      ① <b>뜻</b> — 단어와 뜻, 예문을 확인해요. 이미 아는 단어는 "이미 알아요"로 건너뛰어요.<br>
      ② <b>쓰임</b> — 문장 속에서 어떻게 쓰이는지 봐요.<br>
      ③ <b>고르기</b> — 올바르게 쓰인 문장을 골라요. 틀리면 ②부터 다시!<br>
      ④ <b>발음</b> — 🔊 원어민 발음을 듣고 🎙️ 직접 발음해요. 기계가 알아들으면 통과!<br>
      <span class="dim">(처음 한 번만 판정 엔진을 내려받아요 · 약 40MB)</span></p>
      <p><b>복습</b> — 완료한 단어는 <b>3일 → 7일 → 14일</b> 뒤에 다시 나와요.
      한국어 뜻을 보고 영어를 소리 내어 떠올린 뒤 탭해서 확인하세요.
      4번 연속 기억하면 그 단어는 완전히 내 것! 🎓</p>
      <p><b>수업과 연결</b> — 이번 주 단어들이 다음 수업에 자연스럽게 등장해요. 어디서 나오는지 찾아보세요 😉</p>
    </div>`;
  $("howT").addEventListener("click",()=>{
    const h=$("how"), on=h.style.display==="none";
    h.style.display=on?"block":"none";
    $("howT").textContent="어떻게 하는 건가요? "+(on?"▴":"▾");
  });
  $("go").addEventListener("click",()=>{ session=[...q.reviews.map(x=>({t:"rev",item:x})),
                                                   ...q.news.map(x=>({t:"new",item:x}))];
                                          next(); });
  $("dict").addEventListener("click",dictView);
  const fp=$("fp");
  if(fp) fp.addEventListener("click",()=>{
    fpQueue=TRACK.words.filter(x=>{const st=S(x.w); return st.st>=4 && !st.known;});
    for(let i=fpQueue.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [fpQueue[i],fpQueue[j]]=[fpQueue[j],fpQueue[i]]; }
    fpIdx=0; fpView();
  });
}

/* ═══════════ 세션 진행 ═══════════ */
function next(){
  if(!session.length){
    const q=buildQueues();
    if(q.reviews.length||q.news.length){
      session=[...q.reviews.map(x=>({t:"rev",item:x})), ...q.news.map(x=>({t:"new",item:x}))];
    }
  }
  const job=session.shift();
  if(!job){ home(); return; }
  cur=job.item;
  if(job.t==="rev") reviewView();
  else { const s=S(cur.w); phase=Math.max(1,s.st+1); stageView(); }
}

function shell(inner, tag){
  return `
    <button class="back" id="bk">← 그만하고 저장</button>
    <div class="eyebrow">${tag}</div>
    ${inner}`;
}
function bindBack(){ $("bk").addEventListener("click",()=>{ save(); home(); }); }

/* ═══════════ 새 단어: 4단계 ═══════════ */
function stagesBar(){
  const names=["① 뜻","② 쓰임","③ 고르기","④ 발음"];
  return `<div class="stages">${names.map((n,i)=>{
    const st=i+1;
    const cls = st<phase?"done":st===phase?"on":"";
    return `<button class="stg ${cls}" data-st="${st}" ${st<phase?"":"disabled"}>${n}</button>`;
  }).join("")}</div>`;
}
function bindStages(){
  app().querySelectorAll(".stg.done").forEach(b=>b.addEventListener("click",()=>{
    phase=+b.dataset.st; stageView();
  }));
}

function stageView(){
  if(phase===1) stage1(); else if(phase===2) stage2();
  else if(phase===3) stage3(); else stage4();
}

function stage1(){
  app().innerHTML=shell(`
    ${stagesBar()}
    <div class="word">${esc(cur.w)}</div>
    <div class="komean">${esc(cur.ko)}</div>
    <div class="center" style="margin-bottom:12px">
      <button class="speak" id="tts">🔊 발음 듣기</button>
    </div>
    <div class="card"><div class="en">${hl(cur.ex)}</div><div class="ko">${esc(cur.exko)}</div></div>
    <div class="row2">
      <button class="btn ghost" id="known">이미 알아요</button>
      <button class="btn pri" id="nx">다음 단계 →</button>
    </div>`,"STEP 1 · 뜻 확인");
  bindBack(); bindTTS(); bindStages();
  $("known").addEventListener("click",()=>{ S(cur.w).known=true; save(); next(); });
  $("nx").addEventListener("click",()=>{ S(cur.w).st=Math.max(S(cur.w).st,1); save(); phase=2; stageView(); });
}

function stage2(){
  app().innerHTML=shell(`
    ${stagesBar()}
    <div class="word" style="font-size:30px">${esc(cur.w)}</div>
    <div class="sub center">문장 속에서 어떻게 쓰이는지 보세요</div>
    ${cur.use.map(u=>`<div class="card"><div class="en">${hl(u[0])}</div><div class="ko">${esc(u[1])}</div></div>`).join("")}
    <div class="center" style="margin:4px 0 12px"><button class="speak" id="tts">🔊 단어 다시 듣기</button></div>
    <div class="row2">
      <button class="btn ghost" id="pv">← 뜻 다시</button>
      <button class="btn pri" id="nx">다음 단계 →</button>
    </div>`,"STEP 2 · 쓰임 확인");
  bindBack(); bindTTS(); bindStages();
  $("pv").addEventListener("click",()=>{ phase=1; stageView(); });
  $("nx").addEventListener("click",()=>{ S(cur.w).st=Math.max(S(cur.w).st,2); save(); phase=3; stageView(); });
}

function stage3(){
  mcqPicked=false;
  app().innerHTML=shell(`
    ${stagesBar()}
    <div class="word" style="font-size:30px">${esc(cur.w)}</div>
    <div class="sub center"><b style="color:var(--navy)">${esc(cur.w)}</b>가 올바르게 쓰인 문장을 고르세요</div>
    ${cur.mcq.map((_,i)=>i).sort(()=>Math.random()-.5).map(i=>`<button class="opt" data-i="${i}">${esc(cur.mcq[i])}</button>`).join("")}
    <div id="fb"></div>
    <button class="btn ghost" id="pv" style="margin-top:2px">← 쓰임 다시 보기</button>`,"STEP 3 · 고르기");
  bindBack(); bindStages();
  $("pv").addEventListener("click",()=>{ phase=2; stageView(); });
  app().querySelectorAll(".opt").forEach(b=>b.addEventListener("click",()=>{
    if(mcqPicked) return; mcqPicked=true;
    const i=+b.dataset.i, ok=(i===cur.ans);
    app().querySelectorAll(".opt").forEach(x=>{ x.disabled=true; const k=+x.dataset.i;
      if(k===cur.ans) x.classList.add("ok"); else if(k===i) x.classList.add("no"); });
    const pv=$("pv"); if(pv) pv.style.display="none";
    $("fb").innerHTML=`<div class="fb ${ok?"ok":"no"}">${ok?"정답!":"아쉬워요."} ${esc(cur.note||"")}</div>
      <button class="btn pri" id="nx" style="margin-top:10px">${ok?"다음 단계 →":"다시 보고 넘어가기 →"}</button>`;
    $("nx").addEventListener("click",()=>{
      if(ok){ S(cur.w).st=Math.max(S(cur.w).st,3); save(); phase=4; stageView(); }
      else { phase=2; stageView(); }               /* 오답 → 쓰임부터 다시 */
    });
  }));
}

/* ─────────── 4단계: 발음 ─────────── */
let VOSK={model:null,loading:false};
function stage4(){
  app().innerHTML=shell(`
    ${stagesBar()}
    <div class="word">${esc(cur.w)}</div>
    <div class="komean">${esc(cur.ko)}</div>
    <div class="center" style="margin-bottom:6px"><button class="speak" id="tts">🔊 원어민 발음 듣기</button></div>
    <div class="micwrap">
      <button class="micbtn" id="mic">🎙️</button>
      <div class="micstate" id="ms">버튼을 누르고 <b>${esc(cur.w)}</b>를 또렷하게 발음해 보세요</div>
      <div class="loadbar" id="lb" style="display:none"><i id="lbi"></i></div>
    </div>
    <button class="btn ghost" id="pv">← 이전 단계</button>`,"STEP 4 · 발음");
  bindBack(); bindTTS(); bindStages();
  $("pv").addEventListener("click",()=>{ phase=3; stageView(); });
  $("mic").addEventListener("click",pronounce);
}

async function ensureModel(){
  if(VOSK.model) return VOSK.model;
  if(VOSK.loading) return null;
  VOSK.loading=true;
  $("ms").innerHTML="발음 판정 엔진을 준비하는 중이에요 (최초 1회, 약 40MB)…";
  $("lb").style.display="block";
  let p=0; const t=setInterval(()=>{ p=Math.min(p+4,92); $("lbi").style.width=p+"%"; },400);
  try{
    VOSK.model=await Vosk.createModel(MODEL_URL);
    clearInterval(t); $("lbi").style.width="100%";
    setTimeout(()=>{ $("lb").style.display="none"; },400);
    return VOSK.model;
  }catch(e){
    clearInterval(t); $("lb").style.display="none";
    $("ms").innerHTML="엔진을 불러오지 못했어요. 이 단계는 나중에 다시 하도록 표시해 둘게요.";
    setTimeout(()=>completeWord(false),1600);
    return null;
  }
}

let recBusy=false;
async function pronounce(){
  if(recBusy) return;
  const model=await ensureModel();
  if(!model) return;
  recBusy=true;
  const btn=$("mic"); btn.classList.add("rec");
  $("ms").innerHTML="듣고 있어요… <b>"+esc(cur.w)+"</b>";
  let heard=[];
  let stream=null, ctx=null, node=null, rec=null;
  try{
    stream=await navigator.mediaDevices.getUserMedia({audio:true});
    ctx=new (window.AudioContext||window.webkitAudioContext)();
    if(ctx.state==="suspended") await ctx.resume();
    rec=new model.KaldiRecognizer(ctx.sampleRate, JSON.stringify([cur.w.toLowerCase(),"[unk]"]));
    rec.on("result",m=>{ const t=(m.result.text||"").trim(); if(t) heard.push(t); });
    rec.on("partialresult",m=>{ const t=(m.result.partial||"").trim();
      if(t && t!=="[unk]") $("ms").innerHTML="들리는 중: <span class='heard'>"+esc(t)+"</span>"; });
    const src=ctx.createMediaStreamSource(stream);
    node=ctx.createScriptProcessor(4096,1,1);
    node.onaudioprocess=e=>{ try{ rec.acceptWaveform(e.inputBuffer); }catch(err){} };
    src.connect(node); node.connect(ctx.destination);
    await new Promise(r=>setTimeout(r,3600));      /* 3.6초 듣기 */
  }catch(e){
    btn.classList.remove("rec"); recBusy=false;
    $("ms").innerHTML="마이크를 사용할 수 없어요. 브라우저 권한을 확인해 주세요.";
    return;
  }finally{
    try{ node&&node.disconnect(); }catch(e){}
    try{ stream&&stream.getTracks().forEach(t=>t.stop()); }catch(e){}
    try{ rec&&rec.remove(); }catch(e){}
    try{ ctx&&ctx.close(); }catch(e){}
  }
  btn.classList.remove("rec"); recBusy=false;
  const said=heard.join(" ");
  const pass=said.split(/\s+/).includes(cur.w.toLowerCase());
  if(pass){
    $("ms").innerHTML=`<span class="passmark">통과!</span><br>기계가 <span class="heard">${esc(cur.w)}</span>로 알아들었어요`;
    setTimeout(()=>completeWord(true),1300);
  }else{
    const s=S(cur.w); s._try=(s._try||0)+1;
    if(s._try>=3){
      $("ms").innerHTML="괜찮아요, 이 단어 발음은 다음에 다시 해볼게요 🔁";
      setTimeout(()=>completeWord(false),1500);
    }else{
      $("ms").innerHTML=(said&&said!=="[unk]"
        ? "음… <span class='heard'>"+esc(said.replace(/\[unk\]/g,"?"))+"</span> 처럼 들렸어요."
        : "잘 안 들렸어요.")
        + "<br>🔊 로 다시 듣고 한 번 더! ("+s._try+"/3)";
    }
  }
}

function completeWord(pronOk){
  const s=S(cur.w);
  s.st=4; s.pron=pronOk?1:0; delete s._try;
  s.box=1; s.due=now()+days(BOX_DAYS[1]);
  save();
  app().innerHTML=shell(`
    <div class="done-badge">단어 하나 완료! ✓</div>
    <div class="word">${esc(cur.w)}</div>
    <div class="komean">${esc(cur.ko)}</div>
    <div class="sub center">3일 뒤 복습으로 다시 만나요${pronOk?"":" · 발음은 그때 다시 🔁"}</div>
    <button class="btn gold" id="nx">계속하기 →</button>
    <button class="btn ghost" id="stop">오늘은 여기까지</button>`,"COMPLETE");
  bindBack();
  $("nx").addEventListener("click",next);
  $("stop").addEventListener("click",()=>{ save(); home(); });
}

/* ═══════════ 내 단어장 ═══════════ */
function dictView(){
  const groups={learn:[],rev:[],master:[],known:[]};
  TRACK.words.forEach(x=>{
    const st=S(x.w);
    if(st.known) groups.known.push(x);
    else if(st.box>=4) groups.master.push(x);
    else if(st.st>=4) groups.rev.push(x);
    else if(st.st>=1) groups.learn.push(x);
  });
  const total=groups.learn.length+groups.rev.length+groups.master.length+groups.known.length;
  const G=[["learn","✏️ 배우는 중"],["rev","⏳ 복습 중"],["master","🎓 완전히 익힘"],["known","💡 원래 알던 단어"]];
  const row=x=>{
    const st=S(x.w);
    const pron=st.pron===0?' <span class="dpron">🔁</span>':"";
    return `<div class="drow ${st.known?"dknown":""}" data-w="${esc(x.w)}">
      <button class="dspk" data-w="${esc(x.w)}">🔊</button>
      <span class="dw">${esc(x.w)}${pron}</span>
      <span class="dko">${esc(x.ko)}</span>
    </div>
    <div class="ddet" id="d_${esc(x.w)}" style="display:none">
      <div class="den">${esc(x.ex)}</div><div class="dexko">${esc(x.exko)}</div>
      ${x.note?`<div class="dnote">${esc(x.note)}</div>`:""}
    </div>`;
  };
  app().innerHTML=shell(`
    <h1 style="font-size:28px;margin-bottom:2px"><u>내 단어장</u></h1>
    <div class="sub">지금까지 만난 단어 ${total}개 · 단어를 누르면 예문이 보여요</div>
    <input class="dsearch" id="dq" placeholder="검색 (영어·한국어)" autocomplete="off">
    <div id="dlist">
    ${total===0?'<div class="sub" style="margin-top:14px">아직 만난 단어가 없어요. 새 단어부터 시작해 보세요! ✎</div>':""}
    ${G.map(([k,label])=>groups[k].length?`
      <div class="dgroup">${label} <i>${groups[k].length}</i></div>
      ${groups[k].map(row).join("")}`:"").join("")}
    </div>`,"MY DICTIONARY");
  bindBack();
  $("dq").addEventListener("input",()=>{
    const q=$("dq").value.trim().toLowerCase();
    app().querySelectorAll(".drow").forEach(r=>{
      const hit=!q || r.textContent.toLowerCase().includes(q);
      r.style.display=hit?"":"none";
      const det=document.getElementById("d_"+r.dataset.w);
      if(det && !hit) det.style.display="none";
    });
    app().querySelectorAll(".dgroup").forEach(g=>{
      let el=g.nextElementSibling, any=false;
      while(el && !el.classList.contains("dgroup")){
        if(el.classList.contains("drow") && el.style.display!=="none") any=true;
        el=el.nextElementSibling;
      }
      g.style.display=any?"":"none";
    });
  });
  app().querySelectorAll(".dspk").forEach(b=>b.addEventListener("click",e=>{
    e.stopPropagation();
    try{ speechSynthesis.cancel();
      const u=new SpeechSynthesisUtterance(b.dataset.w); u.lang="en-US"; u.rate=.85;
      speechSynthesis.speak(u); }catch(err){}
  }));
  app().querySelectorAll(".drow").forEach(r=>r.addEventListener("click",()=>{
    const d=document.getElementById("d_"+r.dataset.w);
    if(d) d.style.display=d.style.display==="none"?"block":"none";
  }));
}

/* ═══════════ 자유 연습 (진도 영향 없음) ═══════════ */
let fpQueue=[], fpIdx=0;
function fpView(){
  if(fpIdx>=fpQueue.length){
    app().innerHTML=shell(`
      <div class="done-badge">자유 연습 끝! 수고했어요 ✓</div>
      <div class="sub center">복습 기록에는 영향이 없어요. 예정된 복습은 그대로 진행됩니다.</div>
      <button class="btn gold" id="ok">처음으로</button>`,"FREE PRACTICE");
    bindBack(); $("ok").addEventListener("click",home); return;
  }
  const item=fpQueue[fpIdx]; cur=item;
  let revealed=false;
  app().innerHTML=shell(`
    <div class="sub" style="margin-bottom:8px">${fpIdx+1} / ${fpQueue.length} · 부담 없이 훑어보기</div>
    <div class="recall" id="rc">
      <div class="k">${esc(item.ko)}</div>
      <div class="hint" id="hint">영어로 떠올린 뒤 탭 ↻</div>
      <div class="e" id="en" style="display:none">${esc(item.w)}</div>
      <div class="ko" id="exx" style="display:none;font-size:12.5px;color:var(--mute);margin-top:10px">${esc(item.ex)}</div>
    </div>
    <button class="btn pri" id="nx2">다음 →</button>`,"FREE PRACTICE · 자유 연습");
  bindBack();
  $("rc").addEventListener("click",()=>{
    if(revealed) return; revealed=true;
    $("en").style.display="block"; $("exx").style.display="block"; $("hint").style.display="none";
    try{ const u=new SpeechSynthesisUtterance(item.w); u.lang="en-US"; u.rate=.9; speechSynthesis.speak(u); }catch(e){}
  });
  $("nx2").addEventListener("click",()=>{ fpIdx++; fpView(); });
}

/* ═══════════ 복습 ═══════════ */
function reviewView(){
  const s=S(cur.w);
  const needPron = s.pron===0;
  let revealed=false;
  app().innerHTML=shell(`
    <div class="recall" id="rc">
      <div class="k">${esc(cur.ko)}</div>
      <div class="hint" id="hint">영어로 뭐였죠? 소리 내어 말한 뒤 탭해서 확인 ↻</div>
      <div class="e" id="en" style="display:none">${esc(cur.w)}</div>
    </div>
    <div class="row2" id="grade" style="display:none">
      <button class="btn ghost" id="miss">아직이에요</button>
      <button class="btn pri" id="hit">기억했어요!</button>
    </div>`,"REVIEW · 떠올리기");
  bindBack();
  $("rc").addEventListener("click",()=>{
    if(revealed) return; revealed=true;
    $("en").style.display="block"; $("hint").style.display="none";
    $("grade").style.display="flex";
    try{ const u=new SpeechSynthesisUtterance(cur.w); u.lang="en-US"; u.rate=.9; speechSynthesis.speak(u); }catch(e){}
  });
  $("hit").addEventListener("click",()=>{
    if(needPron){ phase=4; stageView(); return; }   /* 발음 미완 단어는 복습 때 발음 재도전 */
    s.box=Math.min(4,s.box+1);
    s.due = s.box>=4 ? Infinity : now()+days(BOX_DAYS[s.box]);
    if(s.box>=4) s.due=8640000000000000;
    save(); next();
  });
  $("miss").addEventListener("click",()=>{
    s.box=1; s.due=now()+days(1);
    save();
    /* 즉시 재학습: 쓰임부터 */
    phase=2; stageView();
  });
}

/* ═══════════ 공통 ═══════════ */
function hl(sen){
  const re=new RegExp("("+cur.w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"[a-z]*)","i");
  return esc(sen).replace(re,"<b>$1</b>");
}
function bindTTS(){
  const b=$("tts"); if(!b) return;
  b.addEventListener("click",()=>{
    try{ speechSynthesis.cancel();
      const u=new SpeechSynthesisUtterance(cur.w); u.lang="en-US"; u.rate=.85;
      speechSynthesis.speak(u);
    }catch(e){}
  });
}

/* ═══════════ 시작 ═══════════ */
(async()=>{
  if(!FOLDER){ app().innerHTML='<div class="loading">학생 정보가 없어요. 허브에서 들어와 주세요. ✎</div>'; return; }
  try{
    const r=await fetch(`tracks/${FOLDER}.json?t=`+Date.now());
    if(!r.ok) throw 0;
    TRACK=await r.json();
  }catch(e){
    app().innerHTML='<div class="loading">단어 트랙이 아직 준비 중이에요. 곧 만나요! ✎</div>'; return;
  }
  load(); home();
})();
</script>
