<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Olivia · Do English with Brian</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&display=swap" rel="stylesheet">
<style>
  :root{ --navy:#1A2E4C; --gold:#C9A432; --paper:#FFFEF8; --line:#DCE4EE; --margin:#F2B8B8; }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:'Pretendard',sans-serif;background:#CFC9BA;display:flex;justify-content:center;min-height:100vh;padding:20px 0;}
  .note{width:100%;max-width:420px;margin:0 14px;background:var(--paper);border-radius:4px;
    box-shadow:0 10px 30px rgba(0,0,0,.2);position:relative;overflow:hidden;
    background-image:repeating-linear-gradient(transparent,transparent 31px,var(--line) 31px,var(--line) 32px);
    padding:44px 26px 40px 58px;}
  .note::before{content:'';position:absolute;left:42px;top:0;bottom:0;width:1px;background:var(--margin);}
  .holes i{position:absolute;left:12px;width:12px;height:12px;border-radius:50%;background:#CFC9BA;box-shadow:inset 0 1px 2px rgba(0,0,0,.3);}
  .tab{position:absolute;top:0;right:24px;background:var(--gold);color:#fff;font-size:10px;letter-spacing:2px;
    font-weight:700;padding:10px 10px 12px;border-radius:0 0 6px 6px;writing-mode:vertical-rl;}
  .date{font-family:'Nanum Pen Script';font-size:20px;color:#B0A78E;margin-bottom:2px;}
  h1{font-family:'Nanum Pen Script';font-size:38px;color:var(--navy);line-height:1.15;margin-bottom:4px;}
  h1 u{text-decoration-color:var(--gold);text-decoration-thickness:3px;text-underline-offset:5px;}
  .sub{font-size:12px;color:#9B937E;margin-bottom:30px;}
  .todo{display:flex;align-items:center;gap:14px;text-decoration:none;padding:14px 0;}
  .chk{width:22px;height:22px;border:2px solid var(--navy);border-radius:5px;flex-shrink:0;background:#fff;}
  .tx .t{font-size:16px;font-weight:700;color:var(--navy);}
  .tx .d{font-size:11.5px;color:#A39A82;margin-top:2px;display:block;}
  .go{margin-left:auto;font-family:'Nanum Pen Script';font-size:19px;color:var(--gold);white-space:nowrap;}
  .memo{margin-top:30px;font-family:'Nanum Pen Script';font-size:21px;color:var(--navy);transform:rotate(-1deg);}
  .memo b{background:linear-gradient(transparent 60%, rgba(201,164,50,.35) 60%);}
  .foot{margin-top:20px;font-family:'Nanum Pen Script';font-size:20px;color:#B0A78E;}
  .foot b{color:var(--gold);}

  /* Weekly Quiz 강조 (이번 주 미완료일 때만) */
  .todo.wq .t{position:relative;}
  .badge{display:none;margin-left:8px;vertical-align:2px;background:var(--gold);color:#fff;
    font-size:9.5px;font-weight:800;letter-spacing:1px;padding:2px 6px;border-radius:20px;}
  .todo.wq.fresh .badge{display:inline-block;animation:pop .35s ease-out;}
  .todo.fresh2 .badge{display:inline-block;animation:pop .35s ease-out;}
  .todo.wq.fresh .t{
    background:linear-gradient(100deg,
      var(--navy) 0%, var(--navy) 30%,
      #E3C368 44%, #F3E2A8 50%, #E3C368 56%,
      var(--navy) 70%, var(--navy) 100%);
    background-size:300% 100%;-webkit-background-clip:text;background-clip:text;
    color:transparent;-webkit-text-fill-color:transparent;
    animation:shine 2.8s ease-in-out infinite;}
  @keyframes shine{0%,8%{background-position:100% 0;}62%,100%{background-position:-40% 0;}}
  @keyframes pop{from{transform:scale(.6);opacity:0;}to{transform:scale(1);opacity:1;}}
  @media (prefers-reduced-motion: reduce){
    .todo.wq.fresh .t{animation:none;-webkit-text-fill-color:var(--navy);color:var(--navy);}
    .todo.wq.fresh .badge{animation:none;}
  }

  /* ── 오늘의 나 ── */
  .me{background:#fff;border:1.5px solid #E4DCC8;border-radius:14px;padding:13px 14px 11px;margin:14px 0 4px;display:none;}
  .me .mehead{display:flex;align-items:baseline;gap:8px;margin-bottom:9px;}
  .me .metitle{font-family:'Nanum Pen Script';font-size:20px;color:#1A2E4C;}
  .me .streak{margin-left:auto;font-size:11.5px;font-weight:800;color:#C9A432;background:#FBF4DE;border-radius:20px;padding:3px 10px;}
  .me .mrow{display:flex;gap:7px;}
  .mstat{flex:1;text-align:center;border-radius:10px;padding:8px 2px 7px;background:#FAF7EE;}
  .mstat b{display:block;font-size:15px;color:#1A2E4C;line-height:1.25;}
  .mstat span{font-size:9.5px;color:#9B937E;}
  .mstat.done b{color:#2E7D5B;}
  .mstat.todo{background:#FDF6E3;box-shadow:inset 0 0 0 1.5px #E8D9A8;}
  .mstat.todo b{color:#B08A1E;}
  .mstat.todo{display:block;padding:8px 2px 7px;gap:0;}
  .me .mrow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;}
  .mstat b{font-size:14px;}
  .mstat span{display:block;font-size:9.5px;line-height:1.25;word-break:keep-all;}
  @media (max-width:360px){.me .mrow{grid-template-columns:repeat(2,minmax(0,1fr));}}
  .me .meline{margin-top:9px;font-family:'Nanum Pen Script';font-size:16.5px;color:#8A8268;text-align:center;}
</style>
</head>
<body>
<div class="note">
  <div class="holes"><i style="top:60px"></i><i style="top:200px"></i><i style="top:340px"></i><i style="top:480px"></i></div>
  <div class="tab">OLIVIA'S NOTE</div>
  <div class="date">Do English with Brian ✎</div>
  <h1><u>Olivia의 오늘 할 일</u></h1>
  <div class="sub">Olivia 전용 학습 노트</div>


  <a class="todo" href="notes.html">
    <span class="chk"></span>
    <span class="tx"><span class="t">Class Notes</span><span class="d">수업 자료</span></span>
    <span class="go">보러가기→</span>
  </a>
  <a class="todo" href="../level/">
    <span class="chk"></span>
    <span class="tx"><span class="t">내 단어 레벨</span><span class="d">5분 진단 · 지금 아는 단어 수 확인 · 결과는 Brian에게 보내 주세요</span></span>
    <span class="go">해보기→</span>
  </a>

  <div class="memo">오늘 15분이면 충분해요. <b>소리 내서!</b></div>
  <div class="foot">As always, <b>English with Brian</b> ✍</div>
</div>

<script>
/* Class Notes 새 자료 배지 */
(async function(){
  const FOLDER="olivia-h4t2";
  try{
    const r=await fetch("https://api.github.com/repos/briankim-84/dea-m8q3/contents/"+FOLDER,{cache:"no-store"});
    if(!r.ok) return;
    const files=(await r.json()).filter(x=>x.type==="file").map(x=>x.name);
    const notes=files.filter(f=>/\.pdf$/i.test(f)).sort();
    const el=document.querySelector('a.todo[href="notes.html"]'); if(!el) return;
    const key="dewb:seen:"+FOLDER+":notes", seen=localStorage.getItem(key);
    if(seen===null){ try{localStorage.setItem(key,JSON.stringify(notes));}catch(e){} return; }
    let old=[]; try{ old=JSON.parse(seen)||[]; }catch(e){}
    if(notes.some(f=>!old.includes(f))){
      el.classList.add("fresh2");
      const t=el.querySelector(".t");
      if(t && !el.querySelector(".badge")) t.insertAdjacentHTML("beforeend",' <span class="badge">NEW</span>');
    }
  }catch(e){}
})();
</script>
</body>
</html>
